# deploy/compose.platform.yml
# 平台控制面（不含 nginx，nginx 由 compose.nginx.yml 独立管理）
# 服务器工作目录：/srv/vxture/deploy/
# 真实运行参数目录：/srv/vxture/runtime/
# 使用：docker compose -f compose.platform.yml up -d
#
# 前置：
#   1. bash scripts/13-prepare-runtime-env.sh  （准备 /srv/vxture/runtime 并生成 env 与 secrets）
#   2. 手动补全 /srv/vxture/runtime 下的 CHANGEME 字段

name: vx-platform

networks:
  vxture-prod:
    external: true # nginx 容器已在此网络，平台服务加入即可互通

services:
  # ── 数据层 ──────────────────────────────────────────────────────────────────

  # ── 资源上限的判据（2026-08-17 补 cpus / pids_limit）─────────────────────────
  #
  # worker-01 标称 2C2G，**实际可用内存 1607 MB**（`free -m`，2026-08-17）——标称与
  # 可用差着一截，按 2048 算会低估拥挤程度。跑这一栈 14 个容器外加 vx-nginx。
  #
  # 三件事要分开说：
  #
  # 1. `mem_limit` 挡的是**单个**容器跑飞。它挡不住"所有容器一起涨"。
  #    **这台机器上「总和 ≤ 内存」做不到**：留 ~400 MB 给内核与 docker 后，15 个容器
  #    人均只剩 80 MB，而那正好是稳态值——等于一点爆发余量都不给，第一次 SSR 高峰或
  #    一次 pg_dump 就会有容器被 OOM 杀掉。所以目标是**把最坏情况压进 swap 兜得住的
  #    范围**，不是压到内存以下。2026-08-17 按真机实测重定后：合计 2304 MB，占
  #    内存+swap(3654) 的 63%，余量 1350 MB —— 此前是 87% / 余 486 MB。
  # 2. `cpus` 是**垄断闸不是配额**：两核的机器上，一个跑飞的查询就能吃光整机。
  #    上限之和远大于 2 是有意的——它们是天花板，不是预留。
  # 3. `pids_limit` 是 fork 炸弹护栏，按"异常"的门槛设，不是按"够用"设。
  #
  # 有状态件（postgres/redis）刻意不设 `memswap_limit`：宁可变慢也不要被 OOM 杀掉，
  # 库一死所有 depend_on 它的 BFF 跟着倒。无状态件则钉死无 swap（见各自注释）。

  postgres:
    # Pinned by digest to prevent upstream 18-alpine tag drift from silently
    # recreating the stateful DB on pull. Bump tag+digest together to upgrade.
    # 18-alpine digest resolved 2026-08-17 (18.4 -> 18.6, same major:
    # the data directory format is unchanged, so this is a restart not a migration).
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    # Digest-pinned and never expected to change out-of-band; skip the
    # per-deploy manifest round-trip to docker.io (30-deploy-platform-stack.sh
    # unconditionally `pull`s every service). Same pattern already validated
    # varda 已迁独立仓 vxture-varda(2026-08-18),其部署自持。
    pull_policy: missing
    container_name: vx-platform-pg
    restart: unless-stopped
    # Ceiling only (steady state ~40-100MB/container; whole host ~900MB). Stateful:
    # NOT pinned to no-swap (no memswap_limit) so it can lean on swap under pressure
    # rather than be OOM-killed — a killed pg cascades (all BFF depend_on it).
    # Owner: verify against `docker stats` on worker-01 before trusting this value.
    mem_limit: 320m # 实测 43MiB（worker-01，2026-08-17）
    cpus: 1.5
    pids_limit: 256
    networks: [vxture-prod]
    environment:
      POSTGRES_USER: vxture
      POSTGRES_DB: platform_main
      POSTGRES_PASSWORD_FILE: /run/secrets/platform_pg_password
    secrets: [platform_pg_password]
    volumes:
      - /srv/vxture/data/platform-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vxture -d platform_main"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    # Pinned by digest (see postgres note). 8-alpine digest resolved 2026-08-17
    # (8.8.0 -> 8.10.0, same major).
    image: redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    # See postgres note above — digest-pinned, skip the redundant per-deploy pull.
    pull_policy: missing
    container_name: vx-platform-redis
    restart: unless-stopped
    # --maxmemory 96mb (below this 128m ceiling) makes redis self-evict before the
    # cgroup OOM-kills it. volatile-lru only evicts TTL-bearing keys (all session/
    # token/rate-limit keys have TTLs) — an evicted idle session (user re-logs in)
    # beats redis being OOM-killed and losing every session.
    mem_limit: 128m
    cpus: 1.0
    pids_limit: 64
    networks: [vxture-prod]
    secrets: [platform_redis_password]
    volumes:
      - /srv/vxture/data/platform-redis:/data
    command:
      [
        "sh",
        "-c",
        'redis-server --appendonly yes --maxmemory 96mb --maxmemory-policy volatile-lru --requirepass "$$(cat /run/secrets/platform_redis_password)"',
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$$(cat /run/secrets/platform_redis_password)" ping',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── 门户层 ──────────────────────────────────────────────────────────────────

  website:
    image: ${VX_IMAGE_REGISTRY:-ghcr.io}/${VX_IMAGE_NAMESPACE:-vxture}/platform_website:${VX_IMAGE_TAG:-latest}
    container_name: vx-platform-website
    restart: unless-stopped
    mem_limit: 192m # 实测 85MiB（worker-01，2026-08-17）
    cpus: 1.0
    pids_limit: 128
    memswap_limit: 192m # == mem_limit: no swap, so a runaway dies at its own ceiling instead of eating host swap
    networks: [vxture-prod]
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.vxture.com
      NODE_OPTIONS: --max-old-space-size=192
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  console:
    image: ${VX_IMAGE_REGISTRY:-ghcr.io}/${VX_IMAGE_NAMESPACE:-vxture}/platform_console:${VX_IMAGE_TAG:-latest}
    container_name: vx-platform-console
    restart: unless-stopped
    mem_limit: 192m # 实测 77MiB（worker-01，2026-08-17）
    cpus: 1.0
    pids_limit: 128
    memswap_limit: 192m
    networks: [vxture-prod]
    environment:
      NODE_ENV: production
      PORT: "3020"
      NEXT_PUBLIC_API_URL: https://api.vxture.com
      NODE_OPTIONS: --max-old-space-size=192
      # Server-only internal address the console SSR uses to fetch the session
      # snapshot from console-bff (same Docker network). Non-secret; the browser
      # keeps using the public same-origin path. See lib/server/bff-server.ts (#7).
      CONSOLE_BFF_INTERNAL_URL: http://vx-platform-console-bff:3021
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3020/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  admin:
    image: ${VX_IMAGE_REGISTRY:-ghcr.io}/${VX_IMAGE_NAMESPACE:-vxture}/platform_admin:${VX_IMAGE_TAG:-latest}
    container_name: vx-platform-admin
    restart: unless-stopped
    mem_limit: 192m # 实测 78MiB（worker-01，2026-08-17）
    cpus: 1.0
    pids_limit: 128
    memswap_limit: 192m
    networks: [vxture-prod]
    environment:
      NODE_ENV: production
      PORT: "3030"
      NEXT_PUBLIC_API_URL: https://api.vxture.com
      NODE_OPTIONS: --max-old-space-size=192
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3030/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 能力控制台外壳（product_250 M-4 批C,OSS 侧 operator 面）。公网 vhost 域名按
  # 加固决策不入仓：nginx 模板渲染时从主机 env 注入（20-sync-nginx-config.sh）。
  # 薄容器：外壳只有 chrome + 总览,严控内存（worker-01 内存压力已知）。
  opera:
    image: ${VX_IMAGE_REGISTRY:-ghcr.io}/${VX_IMAGE_NAMESPACE:-vxture}/platform_opera:${VX_IMAGE_TAG:-latest}
    container_name: vx-platform-opera
    restart: unless-stopped
    mem_limit: 160m # 实测 54MiB（worker-01，2026-08-17）
    cpus: 1.0
    pids_limit: 128
    memswap_limit: 160m
    networks: [vxture-prod]
    environment:
      NODE_ENV: production
      PORT: "3040"
      NODE_OPTIONS: --max-old-space-size=144
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3040/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 中立身份门面（OIDC 登录 UI）。nginx accounts.vxture.com 把 /oidc/* + /.well-known/*
  # 反代到 vx-platform-auth-bff（内部），其余到本前端。见 docs/design/identity-sso-login-surface.md。
  accounts:
    image: ${VX_IMAGE_REGISTRY:-ghcr.io}/${VX_IMAGE_NAMESPACE:-vxture}/platform_accounts:${VX_IMAGE_TAG:-latest}
    container_name: vx-platform-accounts
    restart: unless-stopped
    mem_limit: 160m # 实测 60MiB（worker-01，2026-08-17）
    cpus: 1.0
    pids_limit: 128
    memswap_limit: 160m
    networks: [vxture-prod]
    environment:
      NODE_ENV: production
      PORT: "3080"
      NEXT_PUBLIC_OIDC_API_BASE: https://accounts.vxture.com
      NEXT_PUBLIC_WEBSITE_URL: https://vxture.com
      NODE_OPTIONS: --max-old-space-size=192
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── 平台 BFF 层 ─────────────────────────────────────────────────────────────

  auth-bff:
    image: ${VX_IMAGE_REGISTRY:-ghcr.io}/${VX_IMAGE_NAMESPACE:-vxture}/platform_bff-auth:${VX_IMAGE_TAG:-latest}
    container_name: vx-platform-auth-bff
    restart: unless-stopped
    mem_limit: 160m # 实测 64MiB（worker-01，2026-08-17）
    cpus: 1.0
    pids_limit: 128
    memswap_limit: 160m
    networks: [vxture-prod]
    ports:
      - "${VX_WORKER01_TAILNET_IP:?set it in runtime/.env}:8081:3081" # 绑定 Tailscale 接口，仅 Tailscale 对端可达。宿主口进 80xx 边缘带（8080=platform-api S2S，8081=auth-bff S2S），容器内口跟 L0 map（3081）——跨仓契约从此只认 80xx，内部重排不再波及产品仓（原 3090 → 3061 → 本次）
    # Overrides any NODE_OPTIONS from env_file (inline wins). Owner: confirm no
    # host .env.* already sets NODE_OPTIONS flags that would be clobbered.
    environment:
      NODE_OPTIONS: --max-old-space-size=144
      AUTH_BFF_PORT: "3081"
    env_file:
      [
        /srv/vxture/runtime/secrets/platform.env,
        /srv/vxture/runtime/secrets/platform-app.env,
        /srv/vxture/runtime/secrets/platform-mail.env,
        /srv/vxture/runtime/secrets/platform-sms.env,
        /srv/vxture/runtime/secrets/platform-identity.env,
        /srv/vxture/runtime/.env.auth-bff,
      ]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  gateway-bff:
    image: ${VX_IMAGE_REGISTRY:-ghcr.io}/${VX_IMAGE_NAMESPACE:-vxture}/platform_bff-gateway:${VX_IMAGE_TAG:-latest}
    container_name: vx-platform-gateway-bff
    restart: unless-stopped
    mem_limit: 96m # 实测 30MiB（worker-01，2026-08-17）
    cpus: 1.0
    pids_limit: 128
    memswap_limit: 96m
    networks: [vxture-prod]
    environment:
      NODE_OPTIONS: --max-old-space-size=96
    env_file: /srv/vxture/runtime/.env.gateway-bff
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  website-bff:
    image: ${VX_IMAGE_REGISTRY:-ghcr.io}/${VX_IMAGE_NAMESPACE:-vxture}/platform_bff-website:${VX_IMAGE_TAG:-latest}
    container_name: vx-platform-website-bff
    restart: unless-stopped
    mem_limit: 128m # 实测 52MiB（worker-01，2026-08-17）
    cpus: 1.0
    pids_limit: 128
    memswap_limit: 128m
    networks: [vxture-prod]
    environment:
      NODE_OPTIONS: --max-old-space-size=144
      WEBSITE_BFF_PORT: "3001"
    env_file:
      [
        /srv/vxture/runtime/secrets/platform.env,
        /srv/vxture/runtime/secrets/platform-app.env,
        /srv/vxture/runtime/secrets/platform-mail.env,
        /srv/vxture/runtime/.env.website-bff,
      ]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      auth-bff: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # model-platform 服务已退役（2026-07-28，product_250 atlas 仓拆分 cutover 完成）：
  # 实现整体迁至外部 vxture-atlas 仓，ATLAS_API_URL（原 MODEL_PLATFORM_URL，
  # 2026-07-29 改名）现指向 atlas 主机。

  console-bff:
    image: ${VX_IMAGE_REGISTRY:-ghcr.io}/${VX_IMAGE_NAMESPACE:-vxture}/platform_bff-console:${VX_IMAGE_TAG:-latest}
    container_name: vx-platform-console-bff
    restart: unless-stopped
    mem_limit: 128m # 实测 59MiB（worker-01，2026-08-17）
    cpus: 1.0
    pids_limit: 128
    memswap_limit: 128m
    networks: [vxture-prod]
    environment:
      NODE_OPTIONS: --max-old-space-size=144
    env_file:
      [
        /srv/vxture/runtime/secrets/platform.env,
        /srv/vxture/runtime/secrets/platform-app.env,
        /srv/vxture/runtime/secrets/platform-mail.env,
        /srv/vxture/runtime/secrets/platform-sms.env,
        /srv/vxture/runtime/.env.console-bff,
      ]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      auth-bff: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3021/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  admin-bff:
    image: ${VX_IMAGE_REGISTRY:-ghcr.io}/${VX_IMAGE_NAMESPACE:-vxture}/platform_bff-admin:${VX_IMAGE_TAG:-latest}
    container_name: vx-platform-admin-bff
    restart: unless-stopped
    mem_limit: 128m # 实测 51MiB（worker-01，2026-08-17）
    cpus: 1.0
    pids_limit: 128
    memswap_limit: 128m
    networks: [vxture-prod]
    environment:
      NODE_OPTIONS: --max-old-space-size=144
      ADMIN_BFF_PORT: "3031"
    env_file:
      [
        /srv/vxture/runtime/secrets/platform.env,
        /srv/vxture/runtime/secrets/platform-app.env,
        /srv/vxture/runtime/secrets/platform-mail.env,
        /srv/vxture/runtime/.env.admin-bff,
      ]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      auth-bff: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3031/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 能力控制台外壳 BFF（workforce RP + auth_request 门 + operator-OBO 换票,M-1/M-4）。
  # 不连库（RP 会话在 Redis）；.env.opera-bff 携带真实 OPERA_BASE_URL。
  opera-bff:
    image: ${VX_IMAGE_REGISTRY:-ghcr.io}/${VX_IMAGE_NAMESPACE:-vxture}/platform_bff-opera:${VX_IMAGE_TAG:-latest}
    container_name: vx-platform-opera-bff
    restart: unless-stopped
    mem_limit: 128m # 实测 45MiB（worker-01，2026-08-17）
    cpus: 1.0
    pids_limit: 128
    memswap_limit: 128m
    networks: [vxture-prod]
    environment:
      NODE_OPTIONS: --max-old-space-size=120
      OPERA_BFF_PORT: "3041"
    env_file:
      [
        /srv/vxture/runtime/secrets/platform.env,
        /srv/vxture/runtime/.env.opera-bff,
      ]
    depends_on:
      redis: { condition: service_healthy }
      auth-bff: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3041/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Product-facing S2S host (product_310 D13): C2 entitlements/visible-set +
  # C3 consume/gauge + commerce jobs (provisioning dispatch, expiry sweeps).
  # No host ports — products reach it only through the nginx internal alias
  # (compose.nginx.yml tailnet-bound listener → vx-platform-api:8080).
  platform-api:
    image: ${VX_IMAGE_REGISTRY:-ghcr.io}/${VX_IMAGE_NAMESPACE:-vxture}/platform_bff-platform-api:${VX_IMAGE_TAG:-latest}
    container_name: vx-platform-api
    restart: unless-stopped
    mem_limit: 128m # 实测 50MiB（worker-01，2026-08-17）
    cpus: 1.0
    pids_limit: 128
    memswap_limit: 128m # owner: verify RSS — this one runs commerce cron jobs (dispatch/expiry sweeps)
    networks: [vxture-prod]
    environment:
      NODE_OPTIONS: --max-old-space-size=144
    env_file:
      [
        /srv/vxture/runtime/secrets/platform.env,
        /srv/vxture/runtime/secrets/platform-app.env,
        /srv/vxture/runtime/.env.platform-api,
      ]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      auth-bff: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

secrets:
  platform_pg_password:
    file: /srv/vxture/runtime/secrets/pg-password
  platform_redis_password:
    file: /srv/vxture/runtime/secrets/redis-password

# deploy/worker-02/compose.varda.yml
# Varda 助手栈（worker-02，独立业务箱；不属 worker-01 平台控制面）
# 服务：varda-bff(3090) + varda-server(3091) + 自带 varda-pg / varda-redis（原3121/3122，2026-07-24 L0端口迁移）
# 使用：docker compose -f compose.varda.yml up -d
#
# 拓扑（详见 docs/deployment/varda-worker-02-runbook.md）：
#   - nginx(worker-01) 的 /varda/ 直连 <worker-02-tailnet-ip>:3090（本栈 varda-bff，须发布到 0.0.0.0，UFW 仅放行 Tailscale 子网）
#   - varda-server → Atlas（LLM 网关，独立仓 vxture-atlas，现部署本机 worker-02:3100，2026-07-27 更正
#     此前指向 worker-01 旧 model-platform 的错误）经 MODEL_PLATFORM_URL 配置；虽同机部署，仍走
#     tailnet IP（不同 compose 栈/docker network，无 Docker DNS 名互通）
#   - varda-pg / varda-redis 为本栈私有（Vela* 会话表 + jti 撤销黑名单），数据自包含
#   - JWT_SECRET 与平台会话签名同值（owner 转运），用于验 admin/console cookie
#
# 前置：./.env.varda-bff / ./.env.varda-server / pg 密码须在 worker-02 本机备好（见 runbook §2）

name: vx-varda

networks:
  vx-varda:
    driver: bridge

volumes:
  varda-pg:
  varda-redis:

# ── 资源上限（2026-08-17 新增；此前本文件一个限额都没有）─────────────────────
#
# worker-02 是 8C24G，但**它不是 varda 一家的**：arda 栈与 vxtpl 栈（都是外仓部署）
# 共享同一台主机。没有上限时，varda 这边一个跑飞的进程会先打垮邻居，而邻居的
# owner 连"是谁干的"都查不出来——他们看到的只是自己被 OOM 了。
#
# 与 worker-01 同一套判据：`mem_limit` 挡单容器跑飞、`cpus` 是垄断闸不是配额、
# `pids_limit` 是 fork 炸弹护栏。有状态件（pg/redis）不禁 swap，宁可慢不要被杀。
#
# **关于本文件不钉 digest**：这是有理由的决定，理由写在 varda-pg 上方——worker-02 走的
# 境内镜像源对 by-digest 拉取限速（实测一个镜像 30 分钟以上），镜像内容改由 worker-01
# `docker save/load` 预载。**不要"顺手补上" digest**：那会把一次部署变成半小时。
#
# 代价是升级不会自己传过来：worker-01 于 2026-08-17 升到 pg 18.6 / redis 8.10.0 后，
# 本机仍是 load 进来的那一版，**要再做一次 save/load 才同步**。

services:
  varda-pg:
    # Tag reference (NOT digest-pinned like worker-01): worker-02 is a mainland box
    # whose docker.io access runs through registry mirrors that throttle by-digest
    # blob pulls (observed: 30min+ for one image). The image content is preloaded
    # from worker-01 via docker save/load (same digest content); pull_policy
    # missing keeps deploys from re-pulling docker.io every time.
    image: postgres:18-alpine
    pull_policy: missing
    container_name: vx-varda-pg
    mem_limit: 512m
    cpus: 2.0
    pids_limit: 256
    restart: unless-stopped
    networks: [vx-varda]
    environment:
      POSTGRES_USER: varda
      POSTGRES_DB: varda
      POSTGRES_PASSWORD_FILE: /run/secrets/varda_pg_password
    secrets: [varda_pg_password]
    volumes:
      - varda-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U varda -d varda"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  varda-redis:
    # Tag reference + preload, same rationale as varda-pg above.
    image: redis:8-alpine
    pull_policy: missing
    container_name: vx-varda-redis
    mem_limit: 128m
    cpus: 1.0
    pids_limit: 64
    restart: unless-stopped
    networks: [vx-varda]
    volumes:
      - varda-redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  varda-server:
    image: ${VX_IMAGE_REGISTRY:-ghcr.io}/${VX_IMAGE_NAMESPACE:-vxture}/varda_agent:${VX_IMAGE_TAG:-latest}
    container_name: vx-varda-server
    mem_limit: 512m
    memswap_limit: 512m # == mem_limit：不给 swap，跑飞的进程死在自己的天花板上，而不是去啃宿主的 swap
    cpus: 2.0
    pids_limit: 128
    restart: unless-stopped
    networks: [vx-varda]
    environment:
      VARDA_SERVER_PORT: "3091"
    env_file: [./.env.varda-server]
    depends_on:
      varda-pg: { condition: service_healthy }
    # varda-server 无 /health 端点 → TCP 探活 3091（原3122）
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(3091,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  varda-bff:
    image: ${VX_IMAGE_REGISTRY:-ghcr.io}/${VX_IMAGE_NAMESPACE:-vxture}/varda_bff:${VX_IMAGE_TAG:-latest}
    container_name: vx-varda-bff
    mem_limit: 256m
    memswap_limit: 256m # == mem_limit：不给 swap，跑飞的进程死在自己的天花板上，而不是去啃宿主的 swap
    cpus: 1.0
    pids_limit: 128
    restart: unless-stopped
    networks: [vx-varda]
    # 发布到 0.0.0.0 供 worker-01 nginx 经 Tailscale 直连；UFW 限制仅 Tailscale 子网可达
    ports: ["3090:3090"]
    environment:
      VARDA_BFF_PORT: "3090"
    env_file: [./.env.varda-bff]
    depends_on:
      varda-redis: { condition: service_healthy }
      varda-server: { condition: service_started }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

secrets:
  varda_pg_password:
    file: ./secrets/varda-pg-password

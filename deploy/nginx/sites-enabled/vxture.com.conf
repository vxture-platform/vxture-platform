# vxture.com — 官网/注册/登录（website portal → vx-platform-website:3000）
# resolver 127.0.0.11 使容器名在请求时解析，容器不存在时返回 502 而不是启动失败

server {
    listen 80;
    listen [::]:80;
    server_name www.vxture.com;
    return 301 https://vxture.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.vxture.com;
    ssl_certificate     /etc/nginx/ssl/live/vxture.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/vxture.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    return 301 https://vxture.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name vxture.com;
    return 301 https://vxture.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vxture.com;

    ssl_certificate     /etc/nginx/ssl/live/vxture.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/vxture.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header X-Content-Type-Options    nosniff always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # ^~ so the long-cache asset regex below never shadows hashed assets
    # (which keep the stronger immutable header).
    location ^~ /_next/static/ {
        if ($vx_takeover = maintenance) { return 503; }
        set $upstream vx-platform-website:3000;
        proxy_pass         http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    on;
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }

    # ── OIDC RP（/auth/*）+ website-bff 数据 API（/api/*）→ 同源到 website-bff ──
    # 让 vx_rp_session cookie 与 portal 同源（identity-access-topology.md §4，D-AT）。
    # /api/health 是 portal 自身的容器健康检查路由，精确避让到前端。
    #
    # **维护档位不挡这一条**：健康检查要回答「它到底好不好」，不是「今天对外开不开」。
    # 把它一起 503，维护期间任何外部探针都只能看到一个自己造出来的故障。
    location = /api/health {
        set $upstream vx-platform-website:3000;
        proxy_pass         http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        if ($vx_takeover = maintenance) { return 503; }
        set $websitebff vx-platform-website-bff:3001;
        proxy_pass         http://$websitebff;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/ {
        if ($vx_takeover = maintenance) { return 503; }
        set $websitebff vx-platform-website-bff:3001;
        proxy_pass         http://$websitebff;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Long-cache un-hashed public assets (images/fonts/favicon served from the
    # app's /public). Only image/font extensions — .js/.css live under
    # /_next/static (immutable, ^~). No /api/* or /auth/* URL ends in these
    # extensions, so this regex never shadows a backend route.
    location ~* \.(?:ico|png|jpe?g|gif|webp|avif|svg|woff2?)$ {
        if ($vx_takeover = maintenance) { return 503; }
        set $upstream vx-platform-website:3000;
        proxy_pass         http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    on;
        # Replace (not append to) any Cache-Control the app sets for /public
        # assets, so the client gets a single, correct value.
        proxy_hide_header  Cache-Control;
        add_header         Cache-Control "public, max-age=604800";
    }

    # ── 站点接管：平台维护 / 临时门户（owner 2026-09-24）────────────────────
    #
    # 2026-09-13 到 2026-09-24 这里写死过一段 rewrite，把根路径指向一张门户页。换形态
    # 就要改这份 conf、进仓、发一次版，而「站点对外是哪一面」这件事又不写在任何一处。
    # 现在换成档位 `$vx_takeover`（conf.d/04-site-takeover.conf 的 map，数据来自
    # site-takeover.defaults + 主机上的 site-takeover.state）：三档在本文件里的写法是
    # **通用**的，切档不改这份 conf、不发版、不重建容器——`35-site-takeover.sh` 改一行
    # 状态 + reload，秒级生效。
    #
    # 两档要的东西不一样：
    #
    #   · maintenance —— **整域每条路径**都 503（下面每个反代 location 各挡一次，
    #     `= /api/health` 例外，见那一段）。503 是给爬虫的正确信号：「暂时不可用，别
    #     把我从索引里摘掉」。发一张 200 的维护页会被当成真内容收录，维护结束后还得
    #     等它被重新抓取才换回来。维护页本身也**不写 noindex**——503 已经把话说完了，
    #     再加 noindex 反而是在长维护里主动要求除名。
    #   · portal      —— **只接管根路径**，站内其余一行不变，而且是 200：那是一张真
    #     要给人看的页，不是故障。
    #
    # 两张接管页都由 nginx 自己发（`root /var/www/html`，由 20-sync-nginx-config.sh 从
    # deploy/nginx/html/ 投放），**不经过上游**——上游全挂时它们照样出得来，这正是维护
    # 页存在的理由。
    #
    # ## 为什么不用 try_files
    #
    # 第一版写的是 `try_files /__takeover/$vx_takeover.html @website;`，靠「这个档位有
    # 没有对应的页」自己当开关，看着更省事。**它是错的，而且错得很安静**：同一个
    # location 里 `try_files` 会把 `if (...) { return 503; }` 整个吃掉——nginx -t 通过、
    # 页也确实发出去了，只是状态码是 **200**，正好踩中上一段刚写下的那件要避免的事。
    # 实测：拿掉 try_files 改成 `return 599`，同一请求立刻回 599；放回去就又变 200。
    # 所以两档统一走 `if` + 内部跳转，location 里不出现 try_files。
    location = / {
        if ($vx_takeover = maintenance) { return 503; }
        if ($vx_takeover = portal)      { rewrite ^ /__takeover/portal.html last; }

        set $upstream vx-platform-website:3000;
        proxy_pass         http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        '';
    }

    # 两张接管页的正文。`internal` = 只能由内部跳转进来（上面的 rewrite、下面的
    # error_page 都算），外面直接敲这个路径拿不到它——会落到 `location /` 反代给上游，
    # 得到一个普通的 404。
    #
    # 不许被缓存：切回 off 之后浏览器还捧着一张接管页，比接管本身难查得多。这里用
    # `expires` 而不是 `add_header Cache-Control`——add_header 不跨层级合并，本 location
    # 里一旦写了一条，server 块那组（HSTS / X-Frame-Options / nosniff / Referrer-Policy）
    # 就**整组不再继承**。`expires` 不参与那套继承。维护页那段写了 Retry-After，所以
    # 它只能把那四个头照抄一遍。
    location = /__takeover/portal.html {
        internal;
        root /var/www/html;
        expires -1;
    }

    # 维护页：503 的正文。
    #
    # 只接管**本服务自己 return 的 503**：`proxy_intercept_errors` 保持默认 off，所以
    # 上游真的回 503 时原样透传，不会被维护页盖住。把一次真故障画成一次计划维护，是
    # 这类机制最容易犯、也最难发现的错。
    error_page 503 /__takeover/maintenance.html;
    location = /__takeover/maintenance.html {
        internal;
        root /var/www/html;
        # `expires` 对 200/3xx 那一组状态才生效，**503 不在其内**——实测维护页回来时
        # 一个 Cache-Control 都没有。所以这里显式写一条 no-store（本 location 已经在
        # 覆盖 add_header 了，多这一条不额外付代价）。
        expires -1;
        add_header Cache-Control             "no-store" always;
        add_header Retry-After                900 always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options           SAMEORIGIN always;
        add_header X-Content-Type-Options    nosniff always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    }
    location / {
        if ($vx_takeover = maintenance) { return 503; }
        set $upstream vx-platform-website:3000;
        proxy_pass         http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        '';
    }
}

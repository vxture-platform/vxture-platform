# atlas.vxture.com — Atlas 模型能力面 / LLM 网关（vx-worker-02 via Tailscale）
#
# Atlas 是 L1 横向能力平台（外部产品仓 vxture-atlas），部署于 vx-worker-02，
# 无公网 IP；本边缘经 Tailscale 反代：
#   Tailscale IP    : ${VX_WORKER02_TAILNET_IP}
#   atlas-app (prod): port 3100   # 端口登记表 L1，beta 3101 预留未部署
#
# 2026-08-18 新增：DNS 早已指向 worker-01，但边缘一直没有这份 vhost——
# 443 上无匹配 SNI 落进 00-default 直接关连接，域名对外等于不存在。
# 端口取值以端口登记表为唯一源。
#
# LLM 网关有流式响应（SSE / chunked completions）：主路径关闭代理缓冲，
# 读超时放宽到 300s——缓冲开着时 token 流会被 nginx 攒成一坨再吐。
# 所有 Tailscale 上游都是静态 IP——无需 Docker resolver。

server {
    listen 80;
    listen [::]:80;
    server_name atlas.vxture.com;
    return 301 https://atlas.vxture.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name atlas.vxture.com;

    ssl_certificate     /etc/nginx/ssl/live/vxture.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/vxture.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header X-Content-Type-Options    nosniff always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    client_max_body_size 25m;

    location = /healthz {
        proxy_pass         http://${VX_WORKER02_TAILNET_IP}:3100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://${VX_WORKER02_TAILNET_IP}:3100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        '';
        # 流式：SSE / chunked completions 不经缓冲直达客户端。
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }
}

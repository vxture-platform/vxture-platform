# runos.vxture.com — RunOS 商业能力面（vx-worker-02 via Tailscale）
#
# RunOS 是 L1 横向能力平台（外部产品仓 vxture-runos），部署于 vx-worker-02，
# 无公网 IP；本边缘经 Tailscale 反代：
#   Tailscale IP    : ${VX_WORKER02_TAILNET_IP}
#   runos-app (prod): port 3120   # 端口登记表 L1；beta 3121 预留但休眠（runos TD-006）
#
# 2026-08-18 新增：与 atlas 同批——DNS 早已指向 worker-01，边缘却没有这份
# vhost，443 上无匹配 SNI 落进 00-default 直接关连接。端口取值以端口登记表
# 为唯一源。
#
# beta 3121 不在此建块：休眠预留，且该号当前仍被 varda-bff 旧口占用
# （varda-20260818.x 部署后迁 3090 腾出）。所有 Tailscale 上游都是静态 IP。

server {
    listen 80;
    listen [::]:80;
    server_name runos.vxture.com;
    return 301 https://runos.vxture.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name runos.vxture.com;

    ssl_certificate     /etc/nginx/ssl/live/vxture.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/vxture.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header X-Content-Type-Options    nosniff always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    client_max_body_size 25m;

    location = /healthz {
        proxy_pass         http://${VX_WORKER02_TAILNET_IP}:3120;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://${VX_WORKER02_TAILNET_IP}:3120;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        '';
        proxy_read_timeout 120s;
    }
}

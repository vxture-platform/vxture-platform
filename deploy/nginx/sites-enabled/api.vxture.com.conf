# api.vxture.com — 公共 API 入口（gateway-bff → vx-platform-gateway-bff:8000）
#
# gateway-bff 按前缀转发到各 BFF（/website-api /console-api /admin-api /auth-api），
# 并**逐条原样转发所有请求头**（只剔 host/connection/content-length）。
# 于是凡是那四个 BFF 挂着的路由，默认都从公网可达——包括本不该公网可达的。
#
# 2026-09-30 实测（不带凭据的 GET）：
#   /auth-api/internal/operator/sessions → 401（路由**存在**，不是 404）
#   /admin-api/healthz  → 200      /console-api/healthz → 200
#   不存在的前缀          → 404（对照组）
#
# auth-bff 的 /internal/* 是运营账号与账号管理的**写动作**面，它的唯一屏障是
# `InternalAuthGuard` 认的 AUTH_INTERNAL_TOKEN——而那个值全平台只有一个，
# 同时也是 platform-api 发给**产品团队**读权益的那一个。
#
# 它不需要公网可达：唯一调用方是 admin-bff 的**服务端**
# （operator-admin.service.ts 走 OIDC_BACKCHANNEL_ISSUER / AUTH_BFF_URL，容器间直连），
# 浏览器一次都不调。所以在边缘直接堵掉。
#
# **不能顺手堵的：** `/admin-api/*` 看着也像内部面，但 admin 容器只设了
# NEXT_PUBLIC_API_URL（没有 NEXT_PUBLIC_ADMIN_BFF_URL），所以 admin 门户的浏览器请求
# 真的走 api.vxture.com/admin-api/*——堵了等于直接打断 admin。

server {
    listen 80;
    listen [::]:80;
    server_name api.vxture.com;
    return 301 https://api.vxture.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.vxture.com;

    ssl_certificate     /etc/nginx/ssl/live/vxture.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/vxture.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    nosniff always;

    client_max_body_size 50M;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 内部面不对公网开放。放在 location / 之前：前缀匹配比通配优先。
    location ^~ /auth-api/internal/ {
        return 404;
    }

    location / {
        set $upstream vx-platform-gateway-bff:8000;
        proxy_pass         http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cookie_path  / "/; SameSite=None; Secure";
    }
}

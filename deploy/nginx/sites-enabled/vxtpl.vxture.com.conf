# vxtpl.vxture.com — vxtpl demo product (vx-worker-02 via Tailscale)
#
# vxtpl runs on vx-worker-02 (no public IP). deploy nginx proxies via Tailscale:
#   Tailscale IP : ${VX_WORKER02_TAILNET_IP}
#   vxtpl-app    : port 3210 当前实听（割接目标 4000，登记表 L3 块首；见下方更正）
#
# TARGET = 4000. This is the SECOND retarget; read both before flipping:
#   2026-07-24  L2 port-plan revision  -> target 3210 (same batch as karda 3233->3240)
#   2026-08-13  owner reclassification -> target 4000  <-- CURRENT
#               vxtpl and agent-template are ONE business (dev sample / test agent),
#               i.e. agent-tier, so it moved out of L2 into L3 and took the L3
#               head sub-block 4000-4009. ontos took over the vacated 3210/3211.
#               Port registry is the sole source of truth for the number.
#
# 2026-08-18 实测更正（上面两行历史记录保留，下面这段以实证为准）：
#   * vxtpl-app 在 worker-02 上实际发布的是 **3210**（`docker ps` 实查：
#     `vxtpl-app 0.0.0.0:3210->3210/tcp`，:3210 回 200）。也就是说 07-24 那次
#     产品侧**切过了**——此前注释"一直在 3232"的推断是错的，3232 已无监听。
#   * "2026-08-13 CUTOVER ARMED: vxtpl confirmed its :4000 listener is up" 的
#     记录在 2026-08-18 不成立：**worker-02 上 4000/4001 无任何监听**，而这份
#     conf 指 4000 已随 v0.20.28/29 上线——vxtpl.vxture.com 公网实测 502。
#   * 按本文件自己立的规矩（"a 502 means ... must be reverted"）与登记表的割接
#     顺序（产品侧先听新口、边缘后切），本次把 5 处 proxy_pass 回指 **3210**
#     保通。**目标值 4000/4001 不变**（端口登记表为唯一源）；vxtpl 仓真正听上
#     4000 之后再翻回来。
#   * 3210 名义上已归 ontos（未建仓，今日无实撞）——vxtpl 必须在 ontos 部署前
#     腾出去，这也是割接不能无限期拖的原因。
#
# Also note the product repo was renamed: vxture-template -> vxtpl (name already
# normalized on their side). References to the old name below are historical.
#
# Same shape as arda.vxture.com.conf (domain/port swapped): all Tailscale
# upstreams are static IPs — no Docker resolver needed. Authoritative template
# source: vxture-template configs/edge/__PRODUCT_CODE__.vxture.com.conf.

server {
    listen 80;
    listen [::]:80;
    server_name vxtpl.vxture.com;
    return 301 https://vxtpl.vxture.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vxtpl.vxture.com;

    ssl_certificate     /etc/nginx/ssl/live/vxture.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/vxture.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header X-Content-Type-Options    nosniff always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    client_max_body_size 25m;

    location /_next/static/ {
        proxy_pass         http://${VX_WORKER02_TAILNET_IP}:3210; # 割接暂回（目标 4000，见文件头）
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    on;
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }

    location = /api/health {
        proxy_pass         http://${VX_WORKER02_TAILNET_IP}:3210; # 割接暂回（目标 4000，见文件头）
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass         http://${VX_WORKER02_TAILNET_IP}:3210; # 割接暂回（目标 4000，见文件头）
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Internal-only job trigger: never publicly reachable (edge 404 = defense
    # in depth on top of the app-side guard; same policy as arda).
    location = /api/usage/flush {
        return 404;
    }

    location /api/ {
        proxy_pass         http://${VX_WORKER02_TAILNET_IP}:3210; # 割接暂回（目标 4000，见文件头）
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://${VX_WORKER02_TAILNET_IP}:3210; # 割接暂回（目标 4000，见文件头）
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        '';
    }
}

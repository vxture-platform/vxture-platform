# vxtpl.vxture.com — vxtpl demo product (vx-worker-02 via Tailscale)
#
# vxtpl runs on vx-worker-02 (no public IP). deploy nginx proxies via Tailscale:
#   Tailscale IP : ${VX_WORKER02_TAILNET_IP}
#   vxtpl-app    : port 4000   # single Next.js standalone service with embedded API
#
# TARGET = 4000. This is the SECOND retarget; read both before flipping:
#   2026-07-24  L2 port-plan revision  -> target 3210 (same batch as karda 3233->3240)
#   2026-08-13  owner reclassification -> target 4000  <-- CURRENT
#               vxtpl and agent-template are ONE business (dev sample / test agent),
#               i.e. agent-tier, so it moved out of L2 into L3 and took the L3
#               head sub-block 4000-4009. ontos took over the vacated 3210/3211.
#               Port registry is the sole source of truth for the number.
#
# The 2026-07-24 flip to 3210 was NEVER performed — this file sat on 3232 the
# whole time, so the retarget cost nothing: one cutover, not two. 3210 went to
# ontos instead; do not resurrect it here.
#
# 2026-08-13 CUTOVER ARMED: vxtpl confirmed its :4000 listener is up, and the 5
# proxy_pass entries below were flipped 3232 -> 4000 in this commit.
#   * This takes effect on the NEXT nginx deploy/reload, not at commit time.
#   * Verify after reload: curl https://vxtpl.vxture.com/ (200) — a 502 means the
#     :4000 listener is not actually reachable over tailnet and this must be
#     reverted to 3232 while vxtpl's side is fixed.
#   * Old port 3232 is retired only after the above check passes.
#
# Also note the product repo was renamed: vxture-template -> vxtpl (name already
# normalized on their side). References to the old name below are historical.
#
# Same shape as arda.vxture.com.conf (domain/port swapped): all Tailscale
# upstreams are static IPs — no Docker resolver needed. Authoritative template
# source: vxture-template configs/edge/__PRODUCT_CODE__.vxture.com.conf.

server {
    listen 80;
    listen [::]:80;
    server_name vxtpl.vxture.com;
    return 301 https://vxtpl.vxture.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vxtpl.vxture.com;

    ssl_certificate     /etc/nginx/ssl/live/vxture.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/vxture.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header X-Content-Type-Options    nosniff always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    client_max_body_size 25m;

    location /_next/static/ {
        proxy_pass         http://${VX_WORKER02_TAILNET_IP}:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    on;
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }

    location = /api/health {
        proxy_pass         http://${VX_WORKER02_TAILNET_IP}:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass         http://${VX_WORKER02_TAILNET_IP}:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Internal-only job trigger: never publicly reachable (edge 404 = defense
    # in depth on top of the app-side guard; same policy as arda).
    location = /api/usage/flush {
        return 404;
    }

    location /api/ {
        proxy_pass         http://${VX_WORKER02_TAILNET_IP}:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://${VX_WORKER02_TAILNET_IP}:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        '';
    }
}

# platform-internal — 产品面 S2S 内网别名(product_310 D13 / arda 回函 06 §5.2)
#
# 监听 8080,该端口在 compose.nginx.yml 仅绑定 Tailscale 接口
# (${VX_WORKER01_TAILNET_IP}:8080),公网不可达——接口绑定即访问控制,无需 IP ACL。
# 产品侧 PLATFORM_API_URL 指向 http://${VX_WORKER01_TAILNET_IP}:8080,此后平台任意
# 重构拓扑(换宿主/换端口/拆服务)只改本文件,产品零改动。
#
# 路由面 = 三通道产品自助端点(与 platform-api 宿主一一对应):
#   /platform/*     → C2 entitlements + sharing visible-set
#   /usage/*        → C3 consume / gauge
#   /provisioning/* → C3 回执 provisioning/ack
#   /openapi.json   → 机器可读的接口契约
# 其余路径一律 404(公网 nginx 本就不路由这些前缀,边界对称)。
#
# 2026-09-30补上后两条。它们在 platform-api 里早就存在,却从来没被路由过——
# 应用层加了端点,边缘这一半没跟上,而两侧都不报错:
#   · POST /provisioning/ack (2026-09-17 加入) 产品根本打不到,
#     而 opera 的上线检查页仍在教运营者让对方去调它——那一格永远点不亮。
#   · /openapi.json 存在的理由写在 main.ts 的注释里:「阻止产品从散文里
#     手抄我们的字段名」(liaison #226 把 workspace_id 抄成 active_workspace),
#     不路由它等于那个理由一直没兑现。

server {
    listen 8080;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location /platform/ {
        set $upstream vx-platform-api:8080;
        proxy_pass         http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /usage/ {
        set $upstream vx-platform-api:8080;
        proxy_pass         http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /provisioning/ {
        set $upstream vx-platform-api:8080;
        proxy_pass         http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # 接口契约(只读)。它不带任何租户数据,但仍在 tailnet 面内。
    location = /openapi.json {
        set $upstream vx-platform-api:8080;
        proxy_pass         http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
    }

    # Alias-level liveness (proxied to the host's /healthz).
    location = /healthz {
        set $upstream vx-platform-api:8080;
        proxy_pass         http://$upstream;
        proxy_http_version 1.1;
    }

    location / {
        return 404;
    }
}

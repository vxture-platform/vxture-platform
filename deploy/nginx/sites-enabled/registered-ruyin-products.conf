# Route registered product subdomains through the shared product catalog.
# @package @vxture/repo
# @layer Infrastructure
# @category deployment
# @author AI-Generated
# @date 2026-11-06
# Exact platform and customer-domain vhosts keep precedence over this wildcard.
server {
    listen 80;
    listen [::]:80;
    server_name *.ruyin.work;
    if ($vx_agent_upstream = "") { return 444; }
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name *.ruyin.work;
    ssl_certificate /etc/nginx/ssl/live/vxture.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/vxture.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # OIDC query parameters must not reach shared access/error logs.
    access_log off;
    error_log /var/log/nginx/error.log crit;
    client_max_body_size 128m;
    resolver 127.0.0.11 valid=30s ipv6=off;
    if ($vx_agent_upstream = "") { return 444; }
    location = /api/usage/flush { return 404; }
    location / {
        proxy_pass http://$vx_agent_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

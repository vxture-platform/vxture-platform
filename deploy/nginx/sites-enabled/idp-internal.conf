# idp-internal — IdP（auth-bff）的 tailnet S2S 别名（E1 PR D，2026-10-04）
#
# 「internal」指的是**只在 tailnet 内可达**（与 platform-internal.conf 同一命名），
# 不是 auth-bff 的 `/internal/*` 路径——那组路径正是本文件要挡在门外的东西。
#
# 监听 8081，该端口在 compose.nginx.yml 仅绑定 Tailscale 接口
# (${VX_WORKER01_TAILNET_IP}:8081)，公网不可达——接口绑定即访问控制，无需 IP ACL。
# 产品侧 OIDC_BACKCHANNEL_ISSUER 指向 http://${VX_WORKER01_TAILNET_IP}:8081（product_230 §2
# 的跨仓契约值），此后 auth-bff 怎么重排都只改本文件，产品零改动。
#
# 此前 compose.platform.yml 把 auth-bff **整个容器**发布在这个口：任何 tailnet 对端都能打到
# `/internal/operator/accounts/*`（运营账号 / 客户账号管理的写动作面），唯一屏障是共享口令。
# 口令分家（PR A）换掉了开门的值，门却还在路边。本文件把门从 tailnet 上拿掉——这是和钥匙
# 无关的第二道墙。
#
# 路由面 = 产品后台合法会打的三组路径（packages/core/oidc-rp/src/http-client.ts：
# `/oidc/token` 换票、`/oidc/jwks` 取公钥；discovery 在 /.well-known/）：
#   /oidc/*          → auth-bff OIDC 协议端点（含产品 S2S 换票与 JWKS）
#   /.well-known/*   → OIDC discovery
#   /healthz         → 别名级存活探针（透到 auth-bff 自己的 /healthz）
# 其余路径一律 404（含 /internal/*）。/internal/* 的唯一合法调用方是 admin / arche / opera-bff
# 的服务端，走容器网 vx-platform-auth-bff:3081，根本不经过这个口。
#
# 写法刻意最小：没有 if、没有 try_files、没有 add_header（这三样在 nginx 里会互相吃掉：
# try_files 吞同 location 的 if，add_header 不跨层级合并）。每条路径的状态码由
# deploy/scripts/lib/nginx-idp-port.test.sh 之外的容器实测钉住（见 PR 正文）。
# Host 用 $http_host 原样透传（含端口）——auth-bff 直接发布时看到的就是 `<ip>:8081`，
# 换成别名后它看到的字节不变。

server {
    listen 8081;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # 不带尾斜杠的 /oidc 与 /.well-known：nginx 对「以 / 结尾的前缀 location + proxy_pass」有一条特殊规则，
    # 请求恰等于去掉斜杠的前缀时回 301 到加斜杠的地址（容器实测 2026-10-04）。这个口只认 404 与放行两种答案，
    # 所以把这两个精确匹配钉成 404，不让它们变成一跳重定向。
    location = /oidc {
        return 404;
    }

    location = /.well-known {
        return 404;
    }

    location /oidc/ {
        set $upstream vx-platform-auth-bff:3081;
        proxy_pass         http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /.well-known/ {
        set $upstream vx-platform-auth-bff:3081;
        proxy_pass         http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Alias-level liveness (proxied to auth-bff's own /healthz).
    location = /healthz {
        set $upstream vx-platform-auth-bff:3081;
        proxy_pass         http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
    }

    location / {
        return 404;
    }
}

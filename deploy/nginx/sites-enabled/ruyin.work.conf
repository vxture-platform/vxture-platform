# ruyin.work — 如音的独立域名，当前只承载一张门户页。
#
# 这是本仓第一个**非 vxture.com 注册域**的 vhost。它有三处与其余 vhost 不同，
# 都是有意的，逐条说明如下。
#
# ## 1. 证书路径仍然是 `ssl/live/vxture.com/`
#
# 看着像写错了，其实是对的：worker-01 上只有**一张**证书，全部 vhost 都指它。
# 2026-09-18 起它的 SAN 从两项扩成四项，多了 `ruyin.work` 与 `*.ruyin.work`
# （仓库变量 `CERT_DOMAINS`，见 docs/50-deployment/12-letsencrypt-cert.md）。
# 那个目录名来自 certbot 的 `--cert-name`，是这张证书的**名字**，不是它的覆盖范围。
#
# 由此带来一条运维约束：这个域的证书不能只看本文件。`CERT_DOMAINS` 少写一个 `-d`
# 的后果是隐蔽的——证书照样签成、到期检查照样过、vxture.com 照样好，只有本域撞
# 「证书名不匹配」。所以 `51-check-platform-alerts.sh` 不只查有效期，还逐项断言
# SAN 覆盖了哪几个域。
#
# ## 2. HSTS 不带 `preload`，也不带 `includeSubDomains`
#
# 其余 vhost 带这两项，是因为 vxture.com 整个域早已这么承诺过。这个域是新的：
# `preload` 一旦进了浏览器内置列表就极难撤回，而 `includeSubDomains` 会替所有
# 还不存在的子域提前定规矩（`www.ruyin.work` 至今是 NXDOMAIN）。等这个域的形态
# 定了再加。`max-age` 照给——本域只有 HTTPS 一条路，这一点现在就是确定的。
#
# ## 3. 除根路径外一律 404，不反代整站
#
# 把 vxture.com 的 website 整个挂到第二个域名下会有三个真问题：同一份内容两个域
# （SEO 自伤）；平台 cookie domain 是 `.vxture.com`，登录在本域上必然走一半就断；
# OIDC 的 redirect_uri 清单里没有本域，认证流会报错而不是优雅拒绝。占位期它只需
# 要出一张页，那就只放行一张页。
#
# 那张页（`deploy/nginx/html/__takeover/portal.html`）是自包含的静态文件：外链只有
# Google Fonts 与备案链接，没有本地子资源、没有 favicon、不发任何请求、不写 storage。
# 所以根路径之外确实没有东西需要放行——「自包含」这一条现在由 `check-site-takeover.mjs`
# 在合并前硬判，不再只是当初查过一次。
#
# 页由 nginx 自己发（`root /var/www/html`），不反代：地址栏留在 ruyin.work，而且本域
# 不依赖平台任何容器。2026-09-13 那版是 `rewrite … break` 反代给 website 容器的。
#
# ## 关于那张页面本身
#
# 说明只放在这里，不放进 HTML：接管页是随请求原样下发的静态文件，写在它里面的注释
# view-source 就能读到；nginx 配置不下发。
#
#  · 那个登录表单不认证任何人，输入不发送、不存储。
#  · 页脚的备案号目前是 vxture.com 那一个。**备案号按域名发**，所以这行字在本域上
#    并不属于本域；owner 2026-09-18 定：本域自己的号下来之前不对外宣传，届时改页脚。
#
# 撤下这张页 = 把本域档位切到 off（`35-site-takeover.sh ruyin.work off`），本域随即
# 整域 404。整个域退役才是删掉本文件（外加把 `CERT_DOMAINS` 改回两项）。

server {
    listen 80;
    listen [::]:80;
    server_name ruyin.work www.ruyin.work;
    return 301 https://ruyin.work$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ruyin.work;

    # 本域当前是 NXDOMAIN，收下这个 server_name 只为「建了 A 记录当天就通」。
    # 通配 SAN 已含 *.ruyin.work，握手成立。
    ssl_certificate     /etc/nginx/ssl/live/vxture.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/vxture.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    return 301 https://ruyin.work$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ruyin.work;

    ssl_certificate     /etc/nginx/ssl/live/vxture.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/vxture.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # 见文件头 §2：本域暂不承诺 includeSubDomains / preload。
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header X-Content-Type-Options    nosniff always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── 站点接管：本域的那张页就是「portal」档（见 conf.d/04-site-takeover.conf）──
    #
    # 2026-09-24 改档位机制时，本域的默认档位定为 `portal` 而不是 `off`：**这个域没有
    # 「真正的页面」可恢复**，off 的含义在这里就是整域 404（见文件头 §3）。这一条写在
    # site-takeover.defaults 里，不写在这份 conf 里——档位是可切的现场状态，不是配置。
    #
    # 与 2026-09-13 那版的实质差别：那张页现在由 nginx 自己发（`/var/www/html`，由
    # 20-sync-nginx-config.sh 从 deploy/nginx/html/ 投放），不再反代给 website 容器。
    # 于是本域**不再依赖平台任何容器**——website 挂了，这个域照常出页，而不是 502。
    # `resolver` 也随之不需要了：本文件已经没有带变量的 proxy_pass。
    #
    # 三档的写法与 vxture.com.conf 完全一致（连「为什么不用 try_files」那条坑也一样，
    # 说明在那份文件里）。差别只有一处：本域的兜底是 404 而不是反代——把 vxture.com
    # 的整站挂到第二个域名下会带来三个真问题，见文件头 §3。
    location = / {
        if ($vx_takeover = maintenance) { return 503; }
        if ($vx_takeover = portal)      { rewrite ^ /__takeover/portal.html last; }

        return 404;
    }

    # 两张接管页的正文。`internal` = 只能由内部跳转进来（上面的 rewrite、下面的
    # error_page 都算），外面直接敲这个路径拿不到它。
    # `expires` 而不是 `add_header Cache-Control`：add_header 不跨层级合并，写一条就会
    # 把 server 块那组安全头整组顶掉。
    location = /__takeover/portal.html {
        internal;
        root /var/www/html;
        expires -1;
    }

    # 维护页：503 的正文，由 nginx 自己发。
    error_page 503 /__takeover/maintenance.html;
    location = /__takeover/maintenance.html {
        internal;
        root /var/www/html;
        # `expires` 对 200/3xx 那一组状态才生效，503 不在其内（实测维护页一个
        # Cache-Control 都没有），所以显式写一条 no-store。
        expires -1;
        add_header Cache-Control             "no-store" always;
        # 本 location 写了 Retry-After，上层那组安全头就整组不再继承，所以照抄一遍
        # （本域的 HSTS 不带 includeSubDomains / preload，见文件头 §2）。
        add_header Retry-After                900 always;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Frame-Options           SAMEORIGIN always;
        add_header X-Content-Type-Options    nosniff always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    }

    # 见文件头 §3：占位期本域只出一张自包含的页，其余路径没有可放行的东西。
    location / {
        return 404;
    }
}

# ruyin.work — 如音的独立域名，当前只承载与 vxture.com 同一张占位页。
#
# 这是本仓第一个**非 vxture.com 注册域**的 vhost。它有三处与其余 vhost 不同，
# 都是有意的，逐条说明如下。
#
# ## 1. 证书路径仍然是 `ssl/live/vxture.com/`
#
# 看着像写错了，其实是对的：worker-01 上只有**一张**证书，全部 vhost 都指它。
# 2026-09-18 起它的 SAN 从两项扩成四项，多了 `ruyin.work` 与 `*.ruyin.work`
# （仓库变量 `CERT_DOMAINS`，见 docs/50-deployment/12-letsencrypt-cert.md）。
# 那个目录名来自 certbot 的 `--cert-name`，是这张证书的**名字**，不是它的覆盖范围。
#
# 由此带来一条运维约束：这个域的证书不能只看本文件。`CERT_DOMAINS` 少写一个 `-d`
# 的后果是隐蔽的——证书照样签成、到期检查照样过、vxture.com 照样好，只有本域撞
# 「证书名不匹配」。所以 `51-check-platform-alerts.sh` 不只查有效期，还逐项断言
# SAN 覆盖了哪几个域。
#
# ## 2. HSTS 不带 `preload`，也不带 `includeSubDomains`
#
# 其余 vhost 带这两项，是因为 vxture.com 整个域早已这么承诺过。这个域是新的：
# `preload` 一旦进了浏览器内置列表就极难撤回，而 `includeSubDomains` 会替所有
# 还不存在的子域提前定规矩（`www.ruyin.work` 至今是 NXDOMAIN）。等这个域的形态
# 定了再加。`max-age` 照给——本域只有 HTTPS 一条路，这一点现在就是确定的。
#
# ## 3. 除根路径外一律 404，不反代整站
#
# 把 vxture.com 的 website 整个挂到第二个域名下会有三个真问题：同一份内容两个域
# （SEO 自伤）；平台 cookie domain 是 `.vxture.com`，登录在本域上必然走一半就断；
# OIDC 的 redirect_uri 清单里没有本域，认证流会报错而不是优雅拒绝。占位期它只需
# 要出一张页，那就只放行一张页。
#
# 那张页（`portals/website/public/llm.html`）是自包含的静态文件：外链只有 Google
# Fonts 与备案链接，没有本地子资源、没有 favicon、不发任何请求、不写 storage。
# 所以根路径之外确实没有东西需要放行——这是查过的，不是估计的。
#
# 用 `rewrite … break` 而不是 `return 302`：地址栏留在 ruyin.work，访客看到的是这个
# 域名本身。`break` 之后不带 URI 的 `proxy_pass` 把改写后的 `$uri` 原样发给上游。
#
# ## 关于那张页面本身
#
# 说明只放在这里，不放进 HTML：`llm.html` 是随请求原样下发的静态文件，写在它里面的
# 注释 view-source 就能读到；nginx 配置不下发。
#
#  · 那个登录表单不认证任何人，输入不发送、不存储。
#  · 页脚的备案号目前是 vxture.com 那一个。**备案号按域名发**，所以这行字在本域上
#    并不属于本域；owner 2026-09-18 定：本域自己的号下来之前不对外宣传，届时改页脚。
#
# 撤下 = 删掉本文件（外加把 `CERT_DOMAINS` 改回两项）。

server {
    listen 80;
    listen [::]:80;
    server_name ruyin.work www.ruyin.work;
    return 301 https://ruyin.work$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ruyin.work;

    # 本域当前是 NXDOMAIN，收下这个 server_name 只为「建了 A 记录当天就通」。
    # 通配 SAN 已含 *.ruyin.work，握手成立。
    ssl_certificate     /etc/nginx/ssl/live/vxture.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/vxture.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    return 301 https://ruyin.work$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ruyin.work;

    ssl_certificate     /etc/nginx/ssl/live/vxture.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/vxture.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # 见文件头 §2：本域暂不承诺 includeSubDomains / preload。
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header X-Content-Type-Options    nosniff always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # 上游用变量给出，带变量的 proxy_pass 需要 resolver 才能在请求时解析容器名。
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = / {
        set $upstream vx-platform-website:3000;
        rewrite ^ /llm.html break;
        proxy_pass         http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # 见文件头 §3：占位期本域只出一张自包含的页，其余路径没有可放行的东西。
    location / {
        return 404;
    }
}

# Ruyin Work customer portal, deployed on worker01.
# @package @vxture/repo
# @layer Infrastructure
# @category deployment
# @author AI-Generated
# @date 2026-11-05
# The existing shared certificate covers ruyin.work and *.ruyin.work.
# Customer subdomains require a separately validated tenant binding before routing.

server {
    listen 80;
    listen [::]:80;
    server_name ruyin.work www.ruyin.work;
    return 308 https://ruyin.work$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ruyin.work;
    ssl_certificate     /etc/nginx/ssl/live/vxture.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/vxture.com/privkey.pem;
    return 308 https://ruyin.work$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ruyin.work;

    ssl_certificate     /etc/nginx/ssl/live/vxture.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/vxture.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "no-referrer" always;

    resolver 127.0.0.11 valid=10s ipv6=off;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        '';

    location = /api/health {
        set $workbench vx-platform-workbench:3060;
        proxy_pass http://$workbench;
    }

    location ^~ /auth/ {
        set $workbenchbff vx-platform-workbench-bff:3061;
        client_max_body_size 16k;
        proxy_pass http://$workbenchbff;
        proxy_cache off;
        proxy_read_timeout 75s;
    }

    location ^~ /api/ {
        set $workbenchbff vx-platform-workbench-bff:3061;
        client_max_body_size 16k;
        proxy_pass http://$workbenchbff;
        proxy_cache off;
        proxy_read_timeout 75s;
    }

    location / {
        set $workbench vx-platform-workbench:3060;
        proxy_pass http://$workbench;
    }
}

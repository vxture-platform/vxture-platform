# ruyin.work — 如音的独立域名，整域 301 到 vxture.com。
#
# owner 2026-09-24：「ruyin.work 还是临时页面，应该和 vxture.com 同一个真实主页。」
#
# ## 为什么是 301 而不是把官网反代到本域
#
# 「同一个真实主页」有两种做法，差别不在配置量上。
#
# 反代（地址栏留在 ruyin.work）要**同时**解决三件事才能用：
#
#   1. 平台 cookie domain 是 `.vxture.com`——登录会走到一半就断，而且断在回调之后，
#      表现是「登录成功然后又没登录」，不是一个干脆的错误；
#   2. OIDC 的 redirect_uri 清单里没有本域，认证流直接报错；
#   3. 同一份内容挂两个域是 SEO 自伤，得给 canonical（那是 website 里的代码改动，
#      要按 Host 出不同的 canonical）。
#
# 那是一批活，不是一次配置。301 把三件事一次性消掉：只有一个域承载内容、只有一个域
# 处理登录、搜索引擎也只看见一个域。访客敲 ruyin.work 落到真首页，这正是 owner 要的。
#
# ## 一条要记住的代价
#
# 301 是**永久**重定向，浏览器会硬缓存。哪天真要反过来（ruyin.work 当主域、vxture.com
# 指过去），改 nginx 对新访客立刻生效，而**敲过一次的老浏览器会继续往 vxture.com 跳**，
# 直到缓存过期。选 301 是因为 owner 这次定的是「内容归 vxture.com」——那是一句关于归属
# 的话，不是一个临时安排；本域当占位页的那 11 天全程 `noindex`，没有链接权重要保。
#
# ## 两个 server 块，一跳到位
#
# 之前是三块：80 与 www:443 先 301 到裸域，裸域再出页。内容不在本域之后若还留着那一
# 层，从 www 或 http 进来就是**两跳**。所以四种入口（http/https × 裸域/www）合成两块，
# 一律一跳到 https://vxture.com。
#
# ## 证书路径仍然是 `ssl/live/vxture.com/`
#
# 看着像写错了，其实是对的：worker-01 上只有**一张**证书，全部 vhost 都指它。
# 2026-09-18 起它的 SAN 从两项扩成四项，多了 `ruyin.work` 与 `*.ruyin.work`
# （仓库变量 `CERT_DOMAINS`，见 docs/50-deployment/12-letsencrypt-cert.md）。
# 那个目录名来自 certbot 的 `--cert-name`，是这张证书的**名字**，不是它的覆盖范围。
#
# **改成纯跳转之后，证书一条都不能少。** 跳转本身是 HTTPS 响应：SAN 里没有 `ruyin.work`
# 的话，访客在握手阶段就撞证书错误，连那个 301 都收不到。所以 `CERT_DOMAINS` 保持四项，
# `51-check-platform-alerts.sh` 里逐项断言 SAN 覆盖了哪几个域的那一段照旧。
#
# ## HSTS 不带 `includeSubDomains`，也不带 `preload`
#
# 其余 vhost 带这两项，是因为 vxture.com 整个域早已这么承诺过。这个域是新的：
# `preload` 一旦进了浏览器内置列表就极难撤回，而 `includeSubDomains` 会替所有还不存在
# 的子域提前定规矩（`www.ruyin.work` 至今是 NXDOMAIN）。`max-age` 照给——本域只有
# HTTPS 一条路，这一点现在就是确定的，纯跳转也一样成立。
#
# ## 不再接站点接管档位
#
# 本域已从 `deploy/nginx/site-takeover.defaults` 摘掉：一个只出 301 的域没有「对外形态」
# 可换，维护与门户两档都由 vxture.com 那一侧承担（跳过去就看到）。那张门户页仍留在
# `deploy/nginx/html/__takeover/portal.html`，随时可以给 vxture.com 切 `portal` 档用。
#
# 摘掉登记会让主机上那份现场状态里多出一个已退役的域；`20-sync-nginx-config.sh` 对此走
# `prune`（丢弃并提示）而不是报错——否则「摘掉一个域」这件事本身会让 deploy 整个失败。
#
# 整个域退役才是删掉本文件（外加把 `CERT_DOMAINS` 改回两项）。

server {
    listen 80;
    listen [::]:80;
    server_name ruyin.work www.ruyin.work;
    return 301 https://vxture.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ruyin.work www.ruyin.work;

    ssl_certificate     /etc/nginx/ssl/live/vxture.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/vxture.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # 见文件头：本域暂不承诺 includeSubDomains / preload。
    add_header Strict-Transport-Security "max-age=63072000" always;

    return 301 https://vxture.com$request_uri;
}

# 00-default.conf — default_server 兜底（product_250 批C 加固硬性项）
#
# 裸 IP / 未知 Host 的扫描不回显任何真实 vhost：
#  - :80  未匹配 server_name → 444（无响应关闭连接）
#  - :443 未知 SNI → ssl_reject_handshake（TLS 握手直接拒绝,不出证书,
#    不给扫描器留下任何主机名线索;nginx ≥1.19.4）
#
# 在此之前未知 Host 会落到按文件名排序第一个 vhost（accounts），等于把真实
# 域名清单送给 IP 扫描器。tailnet 内部监听（:8080,compose.nginx.yml）绑定
# 特定地址,不受本 default_server 影响。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# 04-site-takeover.conf —— 站点接管（平台维护 / 临时门户）的 http 层开关
#
# ── 它解决的是什么 ──
#
# 2026-09-13 上线那张门户页的做法是：直接往 vxture.com 的 `location = /` 里写死一段
# rewrite。那样每换一次形态都要改配置、进仓、发一次版，而「现在站点对外是哪一面」
# 这件事又不写在任何一个地方——它散在两个 vhost 的注释里。
#
# 现在换成一个**档位**：每个域一个值（off / maintenance / portal），vhost 里的写法
# 三档通用，切档不改 conf、不重建容器。
#
# ── 为什么必须放在 conf.d/ ──
#
# compose 只挂载 conf.d / sites-enabled / html / ssl / logs（compose.nginx.yml）。
# 容器里跑的是镜像自带的 nginx.conf，它在 http{} 里 `include /etc/nginx/conf.d/*.conf;`
# ——这是本目录生效的原因。仓里那份 deploy/nginx/nginx.conf 与 snippets/ 都不生效：
# 改它们不报错、也不起作用（见 05-agent-upstream.conf 里记的那次生产事故）。
#
# 文件名 04- 打头：stock nginx.conf 按字典序 include，map 必须排在 main.conf
# （它才 include sites-enabled）之前，变量要先于引用它的 server 块定义。
#
# ── 数据行从哪来 ──
#
# `site-takeover.map` 由 20-sync-nginx-config.sh 渲染（deploy/scripts/lib/site-takeover.sh），
# 数据来自两处：仓内默认 `deploy/nginx/site-takeover.defaults`，被主机上的
# `/srv/vxture/runtime/site-takeover.state` 逐域覆盖。state 不入仓也不被 deploy 覆盖，
# 所以运维改的档位能活过下一次发版。
#
# include 的文件**必须存在**，否则 nginx -t 直接失败。渲染函数因此保证无论如何都产出
# 它——读不到 state 就用默认，而不是写出一个空表。
#
# ── 默认为什么是 off ──
#
# map 的 default 是「没登记的域一律正常放行」。反过来（默认接管）意味着任何一次渲染
# 失误都会让一个域整个下线；而漏登记一个域的代价只是「这个域暂时没法进维护模式」。
# 两个方向的错都可能发生，选后果轻的那个。

map $host $vx_takeover {
    default "off";
    include /etc/nginx/conf.d/site-takeover.map;
}

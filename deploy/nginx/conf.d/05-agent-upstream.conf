# 05-agent-upstream.conf — L3 智能体的边缘路由表（http 层 map）
#
# ── 为什么必须放在 conf.d/ ──
# compose **只挂载 conf.d / sites-enabled / html / ssl / logs**（compose.nginx.yml），
# `nginx.conf` 与 `snippets/` 都没挂。容器里跑的是**镜像自带的** nginx.conf，
# 它在 http{} 里 `include /etc/nginx/conf.d/*.conf;`——这就是本目录生效的原因，
# 也是 conf.d/main.conf 头部那段话的意思。
#
# 仓里那份 deploy/nginx/nginx.conf 反而是不生效的：改它不报错、也不起作用。
# 2026-09-10 我第一版就是把 include 加进了那份，本地测试因为把它一起拷进了容器
# 所以 `nginx -t` 过了，到生产才炸成 `unknown "vx_agent_upstream" variable`
# ——**测的形态和生产不一样**。
#
# 文件名以 05- 打头：stock nginx.conf 按字典序 include，要排在 main.conf
# （它才 include sites-enabled）之前，变量必须先于引用它的 server 块定义。

# websocket / SSE 的 Connection 头。智能体基本都要流式回话。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 子域 → tailnet 上游（host:port）。
#
# 数据行来自 agents-upstream.map，由 deploy/nginx/render-agent-map.mjs 从**产品登记**
# （product.product_webhooks.edge_upstream）渲染。仓里不保存任何一行具体的映射：
# 接一个智能体是运营者在 opera 页面上填一个字段，不是往这里加一行。
#
# 查不到 → 空串 → agents vhost 直接 444，与 00-default.conf 对未知子域的行为一致。
#
# include 的文件**必须存在**，否则 nginx -t 失败。渲染脚本因此保证「无论如何都产出
# 这个文件」：读不到库时保留上一版并告警，从不写出一个空表——空表会让所有已接入的
# 智能体一起 444，那是把一次读库失败放大成一次全线故障。
map $host $vx_agent_upstream {
    default "";
    include /etc/nginx/conf.d/agents-upstream.map;
}

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta http-equiv="refresh" content="60">
<title>平台维护中</title>
<style>
  :root {
    --ink:       #070b14;
    --ink-2:     #0b1220;
    --line:      #1b2740;
    --line-soft: #162034;
    --text:      #e6edf7;
    --text-dim:  #9fb0c9;
    --muted:     #6b7c96;
    --amber:     #e8a33d;

    --sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
  }

  * { box-sizing: border-box; }
  html { background: #070b14; }

  body {
    min-height: 100svh;
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: var(--sans);
    font-weight: 300;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 22px clamp(20px, 5vw, 56px);
    border-bottom: 1px solid var(--line-soft);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .mark { display: inline-flex; align-items: center; gap: 10px; color: var(--text-dim); }
  .glyph { width: 16px; height: 16px; flex: none; color: var(--amber); }
  .state { display: inline-flex; align-items: center; gap: 8px; }
  .dot {
    width: 6px;
    height: 6px;
    background: var(--amber);
    box-shadow: 0 0 0 3px rgba(232, 163, 61, 0.14);
  }

  main {
    flex: 1;
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    padding: clamp(48px, 12vh, 132px) clamp(20px, 5vw, 56px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 28px;
  }

  .code {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.22em;
    color: var(--amber);
  }

  h1 {
    margin: 0;
    font-size: clamp(30px, 5.2vw, 46px);
    font-weight: 500;
    letter-spacing: 0.02em;
    text-wrap: balance;
  }

  p { margin: 0; color: var(--text-dim); font-size: clamp(15px, 1.8vw, 17px); }
  p + p { margin-top: -10px; }

  .rule { height: 1px; background: var(--line); border: 0; margin: 4px 0; }

  .en {
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.7;
    color: var(--muted);
    letter-spacing: 0.01em;
  }

  footer {
    padding: 22px clamp(20px, 5vw, 56px);
    border-top: 1px solid var(--line-soft);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  footer a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--line); }
  footer a:hover { color: var(--text-dim); }
  a:focus-visible, :focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
</style>
</head>
<body>

<div class="topbar">
  <span class="mark">
    <svg class="glyph" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <path d="M2 4.2 8 1.5l6 2.7v7.6L8 14.5 2 11.8z" stroke="currentColor" stroke-linejoin="round"/>
      <path d="M8 6.2v4.2M5.6 7.4v1.8M10.4 7.4v1.8" stroke="currentColor" stroke-linecap="round"/>
    </svg>
    vxture
  </span>
  <span class="state"><span class="dot" aria-hidden="true"></span>maintenance</span>
</div>

<main>
  <div class="code">HTTP 503</div>
  <h1>平台维护中</h1>
  <hr class="rule">
  <p>站点正在进行计划内维护，这段时间内所有页面与接口都不对外提供服务。</p>
  <p>维护完成后会自行恢复，本页会每分钟自动刷新一次，不需要手动清缓存。</p>
  <p class="en">Scheduled maintenance is under way. All pages and APIs on this site are unavailable until it finishes. This page refreshes itself every minute.</p>
</main>

<footer>
  备案号：<a href="https://beian.miit.gov.cn/" target="_blank" rel="noreferrer">陕ICP备2025076448号</a>
</footer>

</body>
</html>

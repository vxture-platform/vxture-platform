name: docker-build

# 主干 + tag 触发：平台部署 tag（dev-*/beta-*/v*.*.*）→ build+push 到 ACR，
# 镜像 tag = github.ref_name（deploy.yml 按同名 tag 拉取部署）。
# 不再在 push main 上构建 :latest（避免首推/日常合并触发无谓构建；镜像只在部署 tag 上出）。
# varda 已迁独立仓 vxture-varda(2026-08-18):本仓镜像清单不再含 varda_*。

on:
  push:
    tags: ["dev-*", "beta-*", "v*.*.*"]

permissions:
  contents: read
  packages: write # 推送到 GHCR 需要

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # B10: 前置变更检测，一次算出本次需重建的镜像集合（动态 matrix）。docs/scripts-only 或
  # 仅改无关路径时 include 为空 → build job 整体跳过（不再 spin 全部镜像腿）；改单包时
  # 只起受影响的腿。镜像构建配置来自 scripts/workflows/images.mjs（单一数据源）。
  # 同时产出 deployability artifact 供 deploy-production 的 gate 门控（B9）——即便 build
  # 被跳过也保证 artifact 存在，避免 gate fail-open 误部署。
  #
  # B11（2026-08-24）：tag 不再无脑全建。diff 基准 = 同系列上一个 tag，命中规则的
  # 镜像照常构建，其余进 reuse 集 → retag job 把上一版 manifest 复制到新 tag
  # （秒级，不传层）。「一个 tag = 一整套镜像都存在」的完整性不变；deploy 侧
  # 未变更镜像逐层 "Already exists" 秒过，worker 的串行拉取策略保留。
  # detect 先 docker login：--verify-reuse 要求 reuse 源镜像真在 GHCR，
  # 缺了（上次发版恰在该镜像失败）就挪回构建集——fail-closed 到构建。
  detect:
    name: Detect images
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      any: ${{ steps.detect.outputs.any }}
      reuse: ${{ steps.detect.outputs.reuse }}
      any_reuse: ${{ steps.detect.outputs.any_reuse }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Log in to GHCR (reuse-source verification)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build matrix + deployability
        id: detect
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/workflows/classify-changes.mjs --matrix --verify-reuse true --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Write deployable flag
        run: echo "${{ steps.detect.outputs.deployable }}" > deployable.txt

      # 仅 main push 需要（tag 不触发 deploy-production）。
      - name: Upload deployability artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: deployability
          path: deployable.txt
          retention-days: 5

  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.any == 'true'

    strategy:
      fail-fast: false # 一个镜像构建失败不中断其他镜像
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # B8: buildx setup 首发失败容错（基础设施抖动）；重试为幂等的全新 setup。
      - name: Set up Docker Buildx
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Set up Docker Buildx (retry)
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Aliyun ACR registry
        id: acr
        shell: bash
        env:
          # registry / internal-host 现为 org **variables**（ACR 迁 cn-beijing 后调整）。
          ALIYUN_ACR_REGISTRY: ${{ vars.ALIYUN_ACR_REGISTRY }}
          ALIYUN_ACR_INTERNAL_HOST: ${{ vars.ALIYUN_ACR_INTERNAL_HOST }}
          # namespace 是 org **variable**（非 secret）；用 secrets.* 会取到空 →
          # acr_enabled=false → 不推 ACR，断掉 deploy 的内网拉取。必须从 vars.* 取。
          ALIYUN_ACR_NAMESPACE: ${{ vars.ALIYUN_ACR_NAMESPACE }}
          ALIYUN_ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
          ALIYUN_ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
        run: bash scripts/workflows/resolve-acr-registry.sh

      - name: Log in to Aliyun ACR
        if: steps.acr.outputs.acr_enabled == 'true'
        shell: bash
        env:
          ACR_REGISTRY: ${{ steps.acr.outputs.acr_registry_public }}
          ALIYUN_ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
          ALIYUN_ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ALIYUN_ACR_PASSWORD" | docker login "$ACR_REGISTRY" -u "$ALIYUN_ACR_USERNAME" --password-stdin

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ matrix.image }}
          tags: |
            # push main → :latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # 部署 tag 的原样名（deploy.yml 用 github.ref_name 拉取）——必需：
            # semver 模式会把 v0.1.0 剥成 0.1.0，且 dev-*/beta-* 非 semver
            # 根本不产出版本 tag，只有 sha-。没有这行 deploy 会 image not found。
            type=raw,value=${{ github.ref_name }},enable=${{ github.ref_type == 'tag' }}
            # tag v1.2.3 → :1.2.3 :1.2 :1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # 每次 push 带 sha 方便回滚
            type=sha,prefix=sha-,format=short

      - name: Resolve image tags
        id: image-tags
        shell: bash
        env:
          ACR_ENABLED: ${{ steps.acr.outputs.acr_enabled }}
          ACR_IMAGE: ${{ steps.acr.outputs.acr_registry_public }}/${{ steps.acr.outputs.acr_namespace }}/${{ matrix.name }}
          METADATA_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          tags="$METADATA_TAGS"

          if [ "$ACR_ENABLED" = "true" ]; then
            while IFS= read -r tag; do
              [ -z "$tag" ] && continue
              tag_name="${tag##*:}"
              tags="${tags}"$'\n'"${ACR_IMAGE}:${tag_name}"
            done <<< "$METADATA_TAGS"
          fi

          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # 健康端点身份块（standard 025）的构建期溯源值：version/sha/stage/buildTime。
      # 作为 build-args 注入镜像 ENV；health route 运行时读取。非 tag 构建诚实兜底 dev。
      - name: Resolve build provenance
        id: prov
        shell: bash
        run: |
          set -euo pipefail
          echo "git_sha=$(printf '%s' '${{ github.sha }}' | cut -c1-8)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "app_version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "app_version=dev" >> "$GITHUB_OUTPUT"
          fi
          case "${{ github.ref_name }}" in
            v*)     stage=production ;;
            beta-*) stage=beta ;;
            dev-*)  stage=dev ;;
            *)      stage=dev ;;
          esac
          echo "deploy_stage=$stage" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # B8: build+push 首发失败容错（GHCR/ACR/buildx 抖动），失败则重试一次。
      # 重试幂等：push 同 tag 覆盖；cache-to 同 scope 覆盖。重试步骤无 continue-on-error，
      # 二次仍失败即让该镜像 matrix 腿失败（fail-fast:false，不影响其它镜像）。
      - name: Build and push
        id: build
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # 显式 target，不靠 stage 顺序（标准 §4，platform#209）：不给 target 时 docker
          # 构建最后一个 stage，日后在 app 之后加任何 stage 都会静默换掉 entrypoint，
          # 且 CI 全绿。三份 Dockerfile 的应用 stage 均名为 runner。
          target: runner
          build-args: |
            ${{ matrix.build-args }}
            NEXT_PUBLIC_CF_TURNSTILE_TENANT_SITE_KEY=${{ vars.CF_TURNSTILE_TENANT_SITE_KEY }}
            NEXT_PUBLIC_CF_TURNSTILE_ADMIN_SITE_ID=${{ vars.CF_TURNSTILE_ADMIN_SITE_KEY }}
            NEXT_PUBLIC_CF_TURNSTILE_ADMIN_SITE_KEY=${{ vars.CF_TURNSTILE_ADMIN_SITE_KEY }}
            NEXT_PUBLIC_ADMIN_BFF_URL=${{ vars.ADMIN_BASE_URL }}
            APP_VERSION=${{ steps.prov.outputs.app_version }}
            GIT_SHA=${{ steps.prov.outputs.git_sha }}
            BUILD_TIME=${{ steps.prov.outputs.build_time }}
            DEPLOY_STAGE=${{ steps.prov.outputs.deploy_stage }}
          # GitHub Packages token 走 BuildKit secret，**不用 build-arg**：build-arg 的值
          # 会留在镜像层历史里（`docker history` 可读），等于把凭据发布到镜像仓库。
          # 拆仓后 Dockerfile 内的 pnpm install 要从 registry 装 @vxture/design-*，
          # 而 GitHub Packages 即便包公开也要求鉴权。
          secrets: |
            node_auth_token=${{ secrets.NODE_AUTH_TOKEN || github.token }}
          platforms: linux/amd64
          push: true
          # 关掉 provenance / SBOM 证明。buildx 默认把它们作为独立 manifest 一起推，
          # 其 config 是 `application/vnd.oci.empty.v1+json`——**阿里云个人版 registry
          # 不认这个 manifest class，直接 denied**。GHCR 收得下，所以现象是「镜像推上去
          # 了一半」：ghcr 有、阿里云没有，而部署拉的是阿里云那份。
          # 2026-08-09 之前一直是绿的，中间 runner 的 buildkit 升级把这两项转成了默认开。
          provenance: false
          sbom: false
          tags: ${{ steps.image-tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 每个服务独立 scope，互不干扰
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Build and push (retry)
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # 显式 target，不靠 stage 顺序（标准 §4，platform#209）：不给 target 时 docker
          # 构建最后一个 stage，日后在 app 之后加任何 stage 都会静默换掉 entrypoint，
          # 且 CI 全绿。三份 Dockerfile 的应用 stage 均名为 runner。
          target: runner
          build-args: |
            ${{ matrix.build-args }}
            NEXT_PUBLIC_CF_TURNSTILE_TENANT_SITE_KEY=${{ vars.CF_TURNSTILE_TENANT_SITE_KEY }}
            NEXT_PUBLIC_CF_TURNSTILE_ADMIN_SITE_ID=${{ vars.CF_TURNSTILE_ADMIN_SITE_KEY }}
            NEXT_PUBLIC_CF_TURNSTILE_ADMIN_SITE_KEY=${{ vars.CF_TURNSTILE_ADMIN_SITE_KEY }}
            NEXT_PUBLIC_ADMIN_BFF_URL=${{ vars.ADMIN_BASE_URL }}
            APP_VERSION=${{ steps.prov.outputs.app_version }}
            GIT_SHA=${{ steps.prov.outputs.git_sha }}
            BUILD_TIME=${{ steps.prov.outputs.build_time }}
            DEPLOY_STAGE=${{ steps.prov.outputs.deploy_stage }}
          # GitHub Packages token 走 BuildKit secret，**不用 build-arg**：build-arg 的值
          # 会留在镜像层历史里（`docker history` 可读），等于把凭据发布到镜像仓库。
          # 拆仓后 Dockerfile 内的 pnpm install 要从 registry 装 @vxture/design-*，
          # 而 GitHub Packages 即便包公开也要求鉴权。
          secrets: |
            node_auth_token=${{ secrets.NODE_AUTH_TOKEN || github.token }}
          platforms: linux/amd64
          push: true
          # 关掉 provenance / SBOM 证明。buildx 默认把它们作为独立 manifest 一起推，
          # 其 config 是 `application/vnd.oci.empty.v1+json`——**阿里云个人版 registry
          # 不认这个 manifest class，直接 denied**。GHCR 收得下，所以现象是「镜像推上去
          # 了一半」：ghcr 有、阿里云没有，而部署拉的是阿里云那份。
          # 2026-08-09 之前一直是绿的，中间 runner 的 buildkit 升级把这两项转成了默认开。
          provenance: false
          sbom: false
          tags: ${{ steps.image-tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  # B11: 未变更镜像的 tag 复用——把同系列上一个 tag 的 manifest 复制到新 tag
  # （`imagetools create` 仓库侧改名，秒级、不重建、不传层）。deploy 等的是整个
  # workflow 的 conclusion，本 job 失败同样挡住部署，tag 完整性 fail-closed。
  # 语义注意：被复用的镜像沿用其构建时烙进的 APP_VERSION/GIT_SHA——health 端点
  # 报的是「该服务内容最后变更的发布号」，不是本次 tag。
  # ⚠ 「核验部署落没落看 docker ps 的镜像 tag 全等新 tag」这条不变式**已作废**：
  # imagetools create 把单 manifest 重包成新 index → 顶层引用 digest 每版必变，于是
  # compose 会把 14 个服务全判成「变了」→ 全量重建（2026-09-01 在 2C2G 上压垮机器）。
  # 30-deploy 因此改为把每个服务钉到 amd64 内容 digest（compose.pinned.yml），docker ps
  # 现在显示 `@sha256:...` 而非 tag。核验改看内容 digest / health version，本次发布号
  # 落在 /srv/vxture/runtime/.last-deploy-tag。详见 deploy/scripts/lib/pin-image-digests.sh。
  # 不打 sha- tag：那会声称镜像出自本次 commit，而它不是；semver 别名
  # （:X.Y.Z/:X.Y/:X）照常前移，它们本就是「系列内最新」的指针。
  retag:
    name: retag ${{ matrix.name }} (unchanged)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.any_reuse == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.reuse) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Aliyun ACR registry
        id: acr
        shell: bash
        env:
          ALIYUN_ACR_REGISTRY: ${{ vars.ALIYUN_ACR_REGISTRY }}
          ALIYUN_ACR_INTERNAL_HOST: ${{ vars.ALIYUN_ACR_INTERNAL_HOST }}
          ALIYUN_ACR_NAMESPACE: ${{ vars.ALIYUN_ACR_NAMESPACE }}
          ALIYUN_ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
          ALIYUN_ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
        run: bash scripts/workflows/resolve-acr-registry.sh

      - name: Log in to Aliyun ACR
        if: steps.acr.outputs.acr_enabled == 'true'
        shell: bash
        env:
          ACR_REGISTRY: ${{ steps.acr.outputs.acr_registry_public }}
          ALIYUN_ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
          ALIYUN_ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ALIYUN_ACR_PASSWORD" | docker login "$ACR_REGISTRY" -u "$ALIYUN_ACR_USERNAME" --password-stdin

      - name: Retag previous manifest to release tag
        shell: bash
        env:
          GHCR_IMAGE: ${{ matrix.image }}
          PREV_TAG: ${{ matrix.prevTag }}
          NEW_TAG: ${{ github.ref_name }}
          ACR_ENABLED: ${{ steps.acr.outputs.acr_enabled }}
          ACR_IMAGE: ${{ steps.acr.outputs.acr_registry_public }}/${{ steps.acr.outputs.acr_namespace }}/${{ matrix.name }}
        run: |
          set -euo pipefail

          # semver 别名与 build 路径的 metadata-action 对齐：v1.2.3 → 1.2.3 / 1.2 / 1。
          tags=("$NEW_TAG")
          if [[ "$NEW_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            tags+=("${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}")
            tags+=("${BASH_REMATCH[1]}.${BASH_REMATCH[2]}")
            tags+=("${BASH_REMATCH[1]}")
          fi

          for tag in "${tags[@]}"; do
            echo "· GHCR ${GHCR_IMAGE}:${tag} ← :${PREV_TAG}"
            docker buildx imagetools create -t "${GHCR_IMAGE}:${tag}" "${GHCR_IMAGE}:${PREV_TAG}"
          done

          if [ "$ACR_ENABLED" = "true" ]; then
            for tag in "${tags[@]}"; do
              # 优先 ACR→ACR（blob 同库，纯 manifest 复制）；ACR 缺上一版时从
              # GHCR 跨库复制兜底（会补传缺失的层，仍远小于一次构建）。
              echo "· ACR ${ACR_IMAGE}:${tag} ← :${PREV_TAG}"
              docker buildx imagetools create -t "${ACR_IMAGE}:${tag}" "${ACR_IMAGE}:${PREV_TAG}" \
                || docker buildx imagetools create -t "${ACR_IMAGE}:${tag}" "${GHCR_IMAGE}:${PREV_TAG}"
            done
          fi

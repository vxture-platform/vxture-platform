name: ci

on:
  # 主干模型：main 的 PR 与 push 跑 CI（quality-gate/build/test-coverage/audit）。
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.ref_name) }}
  cancel-in-progress: true

jobs:
  # ── 1. Format ──────────────────────────────────────────────────────────────
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-node-pnpm

      - name: Check formatting
        run: pnpm format:check

  # ── 2. Audit ───────────────────────────────────────────────────────────────
  audit:
    name: audit
    runs-on: ubuntu-latest
    env:
      # 升级时改这一处（对照 https://github.com/google/osv-scanner/releases）。
      OSV_SCANNER_VERSION: "1.9.2"
    steps:
      - uses: actions/checkout@v6

      # 真 SCA：osv-scanner 扫 pnpm-lock 全依赖树 vs OSV 漏洞库，取代已被 npm 下线的
      # pnpm quick-audit 端点（HTTP 410）。照 secret-scan 的 gitleaks 模式下 pinned
      # 二进制，不用第三方 action（无 license/供应链顾虑）。install 阻断（URL/版本错会响）。
      - name: Install osv-scanner
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" \
            -o osv-scanner
          sudo install -m 0755 osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version

      # 阻断门（audit 是 main-ruleset.json 的 required check）：基线已 triage 清零，osv-scanner
      # 一旦发现新依赖漏洞即 fail，拦住合并。仅 .osv-scanner.toml 里逐条记名接受的残留被过滤
      # （--config 显式指定：扫 --lockfile 时 osv-scanner 不自动发现根 config）。新漏洞若不可即修，
      # 加一条带 reason 的 PackageOverrides（而非放宽此门）。取代原先空跑的假绿。
      - name: OSV dependency scan
        run: osv-scanner --config=.osv-scanner.toml --lockfile=pnpm-lock.yaml

  # ── 3. Check (type · lint · guardrail · boundaries) ───────────────────────
  check:
    # 该名称是稳定契约：被 main-ruleset.json 的 required status checks 按名引用。
    # 内部步骤可演进，但 job 名（quality-gate / build / test-coverage）改动须同步 ruleset。
    name: quality-gate
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      # 本次变更影响的镜像集（= 构建目标）；build/test 据此只处理受影响组件。
      affected_images: ${{ steps.changes.outputs.affected_images }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/workflows/classify-changes.mjs --base "$BASE_SHA" --head "$HEAD_SHA"

      # 始终运行（含 docs-only）：守住分类器 allow-list「默认 SKIP」安全性，
      # 防止规则/逻辑改动悄悄退化为误构建/误部署。无依赖、秒级。
      - name: Classifier allow-list regression test
        run: node --test scripts/workflows/classify-changes.test.mjs

      # 始终运行（含 docs-only）：docs/ 编号铁律硬门（编号=正式/无编号=待删，元规则见
      # docs/10-standards/070-docs-taxonomy.md）。纯 node、无依赖、秒级。
      - name: Docs numbering guardrail
        run: node scripts/guardrails/check-docs-numbering.mjs --strict

      # 公开仓卫生门：本仓 public 是有意设置，边缘用通配符证书正是为了让主机名不进
      # CT 日志——真名/ tailnet 地址一旦提交就白送。文档恰恰是最常泄露的地方，所以
      # 这一步不挂 docs_only 跳过条件。也因此它必须跑在依赖安装**之前**、直接用
      # runner 自带的 node：pnpm 由下面的 setup-node-pnpm 提供，而那一步是挂
      # docs_only 的，docs-only PR 上并不执行。
      - name: Public repo hygiene guardrail
        run: node scripts/guardrails/check-public-repo-hygiene.mjs

      - name: Docs-only quality gate
        if: steps.changes.outputs.docs_only == 'true'
        run: echo "::notice::Docs-only change; heavy quality gate steps skipped while keeping the required check stable."

      - uses: ./.github/actions/setup-node-pnpm
        if: steps.changes.outputs.docs_only != 'true'

      - name: Build shared & core packages
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm build:backend-deps

      # 把已构建的后端依赖 dist 与 Prisma client 作为产物上传，供 build / test job 复用，
      # 避免在并行 job 中重复执行 build:backend-deps 与 prisma generate。
      - name: Upload backend build (deps dist + prisma clients)
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: backend-build
          # ⚠ upload-artifact 的归档根=各 path 的最近公共祖先。此前清单里有
          # agent/varda 的根级路径,祖先=仓根;它们随拆仓删除后祖先漂到 packages/,
          # 下载解包全部错位(2026-08-18 实翻车)。用仓根文件作锚点钉死归档根。
          path: |
            pnpm-workspace.yaml
            packages/shared/shared/dist
            packages/core/*/dist
          retention-days: 1
          include-hidden-files: true

      # 伞包的类型引用的是 design-ui / design-tokens 的**产物**（.d.ts），不是它们的
      # 源码；而 type-check 自己不产出声明。不先构建就必然 TS2307，且这个失败只在
      # 干净检出上出现——本地留着上一次的 dist，看起来一直是绿的。
      # 顺序是硬约束，见 docs/10-standards/050-design-system-release.md §3。
      # 不用 `pnpm build:design`：那个 filter 会连带 next build 整个预览面，
      # 而预览面是私有包，不发布不部署。
      - name: Build design packages (tokens → ui → system)
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          for p in design-tokens design-ui design-system; do
            pnpm --filter "@vxture/$p" build
          done

      # /server 子集的契约只在 react-server 条件下求值才成立——build/type-check/
      # 单测都跑在普通 node 条件下，一条把 createContext 拖进模块作用域的链路
      # 三道关卡一道都不会响（#347：线上被 DCE 兜住、next dev 直接 500）。
      - name: Server entry safety (react-server evaluable)
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm lint:server-entry

      # 发布形态与 monorepo 形态不是一回事：工作区包软链到完整签出，src/ 在、
      # 未发布的文件也在，跨包相对路径怎么写都通；从 registry 装只有 files 列的
      # 东西存在。#268 由消费方分三轮报了六条，全是这个形状——本仓测不出来。
      - name: Packed consumability (registry install shape)
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm lint:packed-consumability

      - name: Type check
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm type-check:all

      - name: Lint
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm --recursive --if-present lint

      - name: Design system guardrail
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm lint:design

      - name: Design system public exports snapshot
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm lint:design-exports

      - name: Design tokens in sync with policy source
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm lint:design-tokens

      # 组件写的类名和 T2 注册脱节时不会报错，只会渲染成没有样式——本地 lint 不覆盖，
      # 必须在这里实测每处类名真能生成。
      - name: Design component classes actually generate
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm lint:design-classes

      # 预览面是这套系统唯一的验收面。组件没有条目就等于改了也没人看得见，
      # 而统计卡照样给出一个自洽但偏小的数字。
      - name: Design preview covers every component
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm lint:design-preview

      - name: Env audit (deploy bundle + runtime template contract)
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          VX_WORKER_DIR="deploy" \
          VX_ENV_AUDIT_FAIL_WARNINGS=1 \
          node scripts/guardrails/audit-env.mjs

      - name: Package boundary check
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm lint:boundaries

      # SQL-DDL 单一权威门控（data_platform_320）：铁律设计检查 + 退役 schema/搬迁表残留检查。
      # 残留检查含路径② Prisma @@schema/@@map（防 model-platform 类漏网：裸串扫描无感的库映射残留）。
      - name: Data architecture guardrail (SQL-DDL single authority)
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          pnpm lint:data-design
          pnpm lint:schema-residue
          pnpm lint:seed
          pnpm lint:catalog-domains

      # 管理面 API 口径门控（product_251 D-3）：规范自己写着「能自动校验的条款就不要
      # 靠人记」。裸 Nest 异常、错误码大小写、审计字段名、`status`/`state` 都是纯文本
      # 模式可判的；动词语义与写入结果可分辨判不了，那两条靠评审。
      - name: Management API conventions guardrail (product_251)
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm lint:api-conventions

  # ── 4. Build ───────────────────────────────────────────────────────────────
  build:
    name: build
    runs-on: ubuntu-latest
    needs: [check]
    # TD-024: auth-bff's RedisService.onModuleInit() awaits a real connection and
    # fails closed by design (it is the central session store) — its boot-smoke
    # needs an actual reachable Redis, unlike the other BFFs' lazy clients.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Docs-only build gate
        if: needs.check.outputs.docs_only == 'true'
        run: echo "::notice::Docs-only change; build check satisfied without artifact build."

      - uses: actions/checkout@v6
        if: needs.check.outputs.docs_only != 'true'

      - uses: ./.github/actions/setup-node-pnpm
        if: needs.check.outputs.docs_only != 'true'

      - name: Restore backend build (deps dist + prisma clients)
        if: needs.check.outputs.docs_only != 'true'
        uses: actions/download-artifact@v8
        with:
          name: backend-build

      # 变更门控：只建/smoke 受影响的组件（quality-gate 的 affected_images，走 docker-build
      # 同款传递依赖规则）。改一个官网页只建 website-bff;改共享包则正确牵连全部。
      # （varda 已迁独立仓 vxture-varda,2026-08-18,本仓不再有 varda 构建面。）
      # TD-024 boot-smoke：建 esbuild bundle 并用假 env 启全 DI 图——唯一验 bundle 运行态
      # 形态的门（隐式构造注入陷阱在此暴露，tsc/单测看不到）。auth-bff 的 boot-smoke
      # 需真 Redis（RedisService.onModuleInit fail-closed）；REDIS_URL 全局设，其余 smoke 忽略。
      - name: Build & boot-smoke affected bundles
        if: needs.check.outputs.docs_only != 'true'
        env:
          AFFECTED: ${{ needs.check.outputs.affected_images }}
          REDIS_URL: redis://localhost:6379
        run: |
          set -euo pipefail
          has() { printf '%s' "$AFFECTED" | grep -q "\"$1\""; }
          smoke() { pnpm --filter "$1" build:bundle && pnpm --filter "$1" boot-smoke; }
          if has platform_bff-admin;              then smoke @vxture/bff-admin; fi
          if has platform_bff-auth;               then smoke @vxture/bff-auth; fi
          if has platform_bff-console;            then smoke @vxture/bff-console; fi
          if has platform_bff-website;            then smoke @vxture/bff-website; fi
          if has platform_bff-opera;              then smoke @vxture/bff-opera; fi
          if has platform_bff-platform-api;       then smoke @vxture/bff-platform-api; fi
          echo "built affected bundles: ${AFFECTED:-[]}"

      # ── 门户 next build ────────────────────────────────────────────────────
      # 补的盲区(#356):在此之前 CI 只建六个 BFF bundle,**一个门户的 next build
      # 都不跑**。门户构建只在 docker-build.yml 里发生,而它只在推 tag 时触发——
      # 于是「只在 next build 阶段暴露」的缺陷(预渲染报错、RSC 边界违规、
      # "use client" 越界)在 PR CI 里完全隐形,一路躺到发版当天才炸。
      #
      # 实际代价:#346 把 THEME_CONSTANTS 从 shared 迁进 design-tokens 后,三个
      # server layout 变成从伞包(首行 "use client")里 `THEME_CONSTANTS.X` 点进去。
      # tsc 全绿、六个 bundle 全绿、五个 PR 合完,打 v0.20.44 时 website 预渲染直接失败。
      #
      # 设计包是门户构建的前置(伞包解析到 dist,不是源码),所以先建三包再建门户。
      # 走同一份 affected_images:改一个门户只建那一个,改共享包才全建。
      - name: Build design packages (portal prerequisite)
        if: needs.check.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          for p in design-tokens design-ui design-system; do
            pnpm --filter "@vxture/$p" build
          done

      - name: Build affected portals (next build)
        if: needs.check.outputs.docs_only != 'true'
        env:
          AFFECTED: ${{ needs.check.outputs.affected_images }}
        run: |
          set -euo pipefail
          has() { printf '%s' "$AFFECTED" | grep -q "\"$1\""; }
          if has platform_website;   then pnpm --filter @vxture/website build; fi
          if has platform_console;   then pnpm --filter @vxture/console build; fi
          if has platform_admin;     then pnpm --filter @vxture/admin build; fi
          if has platform_accounts;  then pnpm --filter @vxture/accounts build; fi
          if has platform_opera;     then pnpm --filter @vxture/opera build; fi
          echo "built affected portals: ${AFFECTED:-[]}"

  # ── 5. Test Coverage ───────────────────────────────────────────────────────
  test:
    name: test-coverage
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - name: Docs-only test gate
        if: needs.check.outputs.docs_only == 'true'
        run: echo "::notice::Docs-only change; test-coverage check satisfied without coverage artifact."

      - uses: actions/checkout@v6
        if: needs.check.outputs.docs_only != 'true'
        with:
          fetch-depth: 0 # pnpm 变更过滤需要 git 历史

      - uses: ./.github/actions/setup-node-pnpm
        if: needs.check.outputs.docs_only != 'true'

      - name: Restore backend build (deps dist + prisma clients)
        if: needs.check.outputs.docs_only != 'true'
        uses: actions/download-artifact@v8
        with:
          name: backend-build

      # 只测变更包 + 依赖者（pnpm 原生 `...[<since>]`：<since> 起变更的包 ∪ 其依赖者）。
      # base 不可用（首推/force-push，SHA 为空或全零）时回退全量测试。
      - name: Run tests (changed packages + dependents)
        if: needs.check.outputs.docs_only != 'true'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "testing packages changed since $BASE_SHA + dependents"
            pnpm --filter "...[${BASE_SHA}]" --if-present test
          else
            echo "base '$BASE_SHA' unavailable — running all tests"
            pnpm --recursive --if-present test
          fi

  # ── 6. SonarQube ───────────────────────────────────────────────────────────
  # Coverage generate/upload/download steps removed 2026-07-28: model-platform
      # (旧 model-platform 服务已迁 vxture-atlas,2026-07-28)
  # retired with the atlas repo split. Scan runs without a coverage input
  # until a new package is wired up — the gate is already non-blocking below.
  sonar:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: [check, test]
    if: >
      needs.check.outputs.docs_only != 'true' &&
      (
        github.event_name == 'pull_request' ||
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/beta' ||
        github.ref == 'refs/heads/develop'
      )
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        # 硬门禁（2026-08-10 恢复，liaison platform#189 收口）。历史：这里长期挂着
        # `continue-on-error: true`，注释写的真因是"本仓尚未在 SonarCloud 绑定项目"——那个诊断
        # 是错的。`vxture-atlas` 报的是逐字节相同的错误，说明失败在**组织级 `SONAR_TOKEN` 全域
        # 403**，与本仓项目绑定无关；照旧注释去建项目，建完仍然不通。owner 换发 token 后本仓
        # 首次真实扫描成功（`ANALYSIS SUCCESSFUL` + `EXECUTION SUCCESS`，project
        # `vxture_vxture-platform`），非阻塞的理由随之消失：**扫不动就应该红**，否则绿色只是
        # "没扫"的另一种写法。
        #
        # 本 job 不在 ruleset 的五个必需 check 里，所以红了不挡合并——要挡需要 owner 把
        # `SonarQube` 加进 required checks，那是独立决定，不在本次改动内。
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        with:
          skipSignatureVerification: false
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

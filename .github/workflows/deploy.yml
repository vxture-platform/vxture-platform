name: deploy

# 主干 + tag 触发 CD。tag 前缀 → 环境；环境级密钥 + 生产审批门控由 `environment:` 承接。
# 前置：镜像已由 docker-build.yml 在同一 tag 上 build+push 到 ACR（tag = github.ref_name）。
#
# 这是 domestic profile（ACR 内网 + tailnet）：CI runner 入 tailnet → 走内网到 worker-01，
# worker-01 的 SSH 不对公网开放。host 用 DEPLOY_HOST_TAILNET_IP（tailnet 地址）；
# DEPLOY_HOST_PUBLIC_IP 留作手工运维兜底，CI 不用。
#
# 环境级密钥命名以 DEPLOY_HOST_* 为准（owner 2026-08-21 定；旧名 DEPLOY_HOST_TAILNET /
# DEPLOY_USER / DEPLOY_SSH_KEY / DEPLOY_SSH_PASSPHRASE 已作废）。取不到的 secret 在
# Actions 里是**空串而不是报错**，所以名字对不上的症状是 SSH 连接失败，不是"缺配置"。
#
# 两个当前未接线的环境密钥，都是有意保留：
#   · DEPLOY_HOST_PORT       —— SSH 仍是 22（owner 2026-08-21 确认），ssh-action 默认即 22，
#                               故不传。改端口时在此处补 `port:` 并同步 db-init/cert/alerts。
#   · DEPLOY_HOST_PRIVATE_IP —— Aliyun VPC 内网地址，为后续内网路径预留。
#
# 过渡期回退 `新名 || 旧名`：新仓已按 DEPLOY_HOST_* 配好，**旧仓的 production 环境
# 仍是旧名**，而生产目前从旧仓发版。缺失的 secret 在 Actions 里求值为空串（falsy），
# 所以 `||` 会自动落到还在的那一个——两个仓在切换期都能部署。
# **移除条件**：发版通道确认切到新仓、且旧仓不再承担部署之后，把 `|| secrets.DEPLOY_*`
# 一并删掉。留着不会出错，但会让"哪个名字才是权威"这件事一直有两个答案。
# umbra 是 overseas 变体（README §5）：去掉 tailscale join、镜像换 GHCR、直连公网 SSH。
#
# 主机侧只同步部署包（compose/scripts/database…）到 /srv/vxture/deploy；实际 .env、
# secrets、证书保持在 worker-01 本机（人工维护）。常规升级链路（31）只拉镜像重建 +
# 健康校验，**不跑 migration/seed** —— seed reseed 是独立授权的人工 DB 操作。

on:
  push:
    tags:
      - "dev-*"
      - "beta-*"
      - "v*.*.*"
    # varda 已迁独立仓 vxture-varda(2026-08-18)。本 workflow 纯平台。

permissions:
  contents: read
  actions: read # gh run list：等待同 tag 的 docker-build 完成

concurrency:
  # 同一环境串行，不取消进行中的生产部署。
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.map.outputs.env }}
    steps:
      - id: map
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            dev-*)   echo "env=develop"    >> "$GITHUB_OUTPUT" ;;
            beta-*)  echo "env=beta"       >> "$GITHUB_OUTPUT" ;;
            v*.*.*)  echo "env=production" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::unrecognized deploy tag ${GITHUB_REF_NAME}"; exit 1 ;;
          esac

  deploy:
    name: Deploy (${{ needs.resolve.outputs.env }})
    needs: resolve
    runs-on: ubuntu-latest
    # environment 承接两件事：① 注入该环境的 DEPLOY_* 密钥 / CF_TURNSTILE_* 变量；
    # ② production 触发必需审批人门控（tag 部署策略已限 v*.*.* 才能进 production）。
    environment: ${{ needs.resolve.outputs.env }}
    steps:
      - uses: actions/checkout@v5

      # deploy 与 docker-build 由同一 tag 并行触发、无先后依赖。过审批门后先确保本 tag
      # 的 docker-build 已成功（镜像已推 ACR），否则 host 拉取会 image not found
      # （2026-07-15 首发教训）。轮询等待（最多 ~20min）。
      - name: Wait for docker-build to publish images
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for i in $(seq 1 80); do
            line="$(gh run list -R "$REPO" --workflow=docker-build.yml --event=push \
                      --json headBranch,status,conclusion \
                      -q "[.[] | select(.headBranch==\"$TAG\")][0] | (.status)+\"/\"+((.conclusion)//\"-\")" 2>/dev/null || echo "")"
            case "$line" in
              completed/success) echo "docker-build succeeded for $TAG"; exit 0 ;;
              completed/*) echo "::error::docker-build for $TAG did not succeed ($line)"; exit 1 ;;
              *) echo "waiting for docker-build ($TAG): ${line:-pending} [$i/80]"; sleep 15 ;;
            esac
          done
          echo "::error::timed out waiting for docker-build ($TAG)"; exit 1

      # registry 归一化在 runner 端完成（与 docker-build 复用同一脚本），拉取优先内网地址；
      # 归一化结果传入 SSH，host 上只做 docker login，不重复实现归一化逻辑。
      # 注意：namespace 是 org **variable**（非 secret），从 vars.* 取。
      - name: Resolve image registry (ACR)
        id: registry
        shell: bash
        env:
          # registry / internal-host 是 org **variables**（2026-07-15 ACR 迁 cn-beijing
          # 后由 secret 改为 variable）；username/password 仍是 secrets。
          ALIYUN_ACR_REGISTRY: ${{ vars.ALIYUN_ACR_REGISTRY }}
          ALIYUN_ACR_INTERNAL_HOST: ${{ vars.ALIYUN_ACR_INTERNAL_HOST }}
          ALIYUN_ACR_NAMESPACE: ${{ vars.ALIYUN_ACR_NAMESPACE }}
          ALIYUN_ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
          ALIYUN_ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
        run: bash scripts/workflows/resolve-acr-registry.sh

      - name: Join tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: ${{ vars.TAILSCALE_OAUTH_CLIENT_TAG }}

      # 只同步部署包；实际 .env / secrets / 证书保持在 worker-01 本机。
      - name: Upload deploy files to worker-01
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST_TAILNET_IP || secrets.DEPLOY_HOST_TAILNET }}
          username: ${{ secrets.DEPLOY_HOST_USER || secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_HOST_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_HOST_SSH_KEY_PASSPHRASE || secrets.DEPLOY_SSH_PASSPHRASE }}
          # 主机指纹校验（4-8，模板标准 §2.2 要求 fail-closed）。
          # 未设 DEPLOY_KNOWN_HOSTS 时该参数为空串，action 退回「不校验主机指纹」
          # ——**这一步在 owner 把该 secret 配上之前是不生效的**，属于有意的
          # 「先接线、后启用」：接线本身零风险，而没接线的话配好 secret 也不会生效。
          # 取值：在能连上 worker-01 的机器上跑
          #   ssh-keyscan -t ed25519 <host> | ssh-keygen -lf - | awk '{print $2}'
          fingerprint: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          source: "deploy/compose.platform.yml,deploy/compose.nginx.yml,deploy/.env.example,deploy/.env.*.example,deploy/secrets/*.example,deploy/scripts,deploy/maintenance,deploy/nginx,deploy/guardrails,deploy/database"
          target: "/tmp/vxture-deploy-${{ github.run_id }}"
          rm: true
          timeout: 120s
          command_timeout: 10m

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          VX_IMAGE_TAG: ${{ github.ref_name }}
          VX_ACR_ENABLED: ${{ steps.registry.outputs.acr_enabled }}
          # 主镜像源(owner 2026-08-22 接线)。此前主源是**写死的逻辑**:ACR 可用就用
          # ACR、否则 ghcr.io——没有任何开关能改变这个偏好。现在由 vars 给定,
          # 另一个源自动降为兜底,两源的韧性保持不变。
          # 取值:aliyun-acr | ghcr。未设时默认 aliyun-acr(与接线前行为一致)。
          VX_IMAGE_PRIMARY_REGISTRY: ${{ vars.IMAGE_PRIMARY_REGISTRY }}
          # 内网优先(快/省流)、公网兜底(worker-01 内网 ACR 端点不可达时)。
          VX_IMAGE_REGISTRY_INTERNAL: ${{ steps.registry.outputs.acr_registry_internal }}
          VX_IMAGE_REGISTRY_PUBLIC: ${{ steps.registry.outputs.acr_registry_public }}
          VX_IMAGE_NAMESPACE: ${{ steps.registry.outputs.acr_namespace }}
          ALIYUN_ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
          ALIYUN_ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
          # 主机布局来自环境级 vars（治理标准 §6：DEPLOY_DIR 精确到 stack 目录）；
          # 未设时回落已验证默认（标准 §4 认可的 ${VAR:-<已验证默认>} 形态）。
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          DEPLOY_RUNTIME_DIR: ${{ vars.DEPLOY_RUNTIME_DIR }}
          # Per-run staging dir (platform#223): a fixed /tmp path is shared state
          # between concurrent CD runs on the same host, and appleboy/scp-action
          # `rm: true` wipes it before writing.
          STAGE_DIR: /tmp/vxture-deploy-${{ github.run_id }}
        with:
          host: ${{ secrets.DEPLOY_HOST_TAILNET_IP || secrets.DEPLOY_HOST_TAILNET }}
          username: ${{ secrets.DEPLOY_HOST_USER || secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_HOST_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_HOST_SSH_KEY_PASSPHRASE || secrets.DEPLOY_SSH_PASSPHRASE }}
          # 主机指纹校验（4-8，模板标准 §2.2 要求 fail-closed）。
          # 未设 DEPLOY_KNOWN_HOSTS 时该参数为空串，action 退回「不校验主机指纹」
          # ——**这一步在 owner 把该 secret 配上之前是不生效的**，属于有意的
          # 「先接线、后启用」：接线本身零风险，而没接线的话配好 secret 也不会生效。
          # 取值：在能连上 worker-01 的机器上跑
          #   ssh-keyscan -t ed25519 <host> | ssh-keygen -lf - | awk '{print $2}'
          fingerprint: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          command_timeout: 60m
          envs: VX_IMAGE_TAG,VX_IMAGE_PRIMARY_REGISTRY,VX_ACR_ENABLED,VX_IMAGE_REGISTRY_INTERNAL,VX_IMAGE_REGISTRY_PUBLIC,VX_IMAGE_NAMESPACE,ALIYUN_ACR_USERNAME,ALIYUN_ACR_PASSWORD,DEPLOY_DIR,DEPLOY_RUNTIME_DIR,STAGE_DIR
          script: |
            set -e

            # 服务端只同步部署包，实际 .env、secrets、证书保持在 worker-01 本机。
            DEPLOY_DIR="${DEPLOY_DIR:-/srv/vxture/deploy}"
            mkdir -p "$DEPLOY_DIR"
            cp -f "$STAGE_DIR"/deploy/compose.platform.yml "$DEPLOY_DIR/compose.platform.yml"
            cp -f "$STAGE_DIR"/deploy/compose.nginx.yml "$DEPLOY_DIR/compose.nginx.yml"
            cp -f "$STAGE_DIR"/deploy/.env.example "$DEPLOY_DIR/.env.example"
            cp -f "$STAGE_DIR"/deploy/.env.*.example "$DEPLOY_DIR/"
            mkdir -p "$DEPLOY_DIR/secrets"
            cp -f "$STAGE_DIR"/deploy/secrets/*.example "$DEPLOY_DIR/secrets/"
            rm -rf "$DEPLOY_DIR/scripts"
            cp -R "$STAGE_DIR"/deploy/scripts "$DEPLOY_DIR/scripts"
            rm -rf "$DEPLOY_DIR/maintenance"
            cp -R "$STAGE_DIR"/deploy/maintenance "$DEPLOY_DIR/maintenance"
            rm -rf "$DEPLOY_DIR/nginx"
            cp -R "$STAGE_DIR"/deploy/nginx "$DEPLOY_DIR/nginx"
            rm -rf "$DEPLOY_DIR/guardrails"
            cp -R "$STAGE_DIR"/deploy/guardrails "$DEPLOY_DIR/guardrails"
            rm -rf "$DEPLOY_DIR/database"
            cp -R "$STAGE_DIR"/deploy/database "$DEPLOY_DIR/database"

            # Staging dir is per-run, so removing it here keeps /tmp from growing
            # one tree per deploy. Failure paths leave it behind on purpose —
            # a failed deploy is the case where you want the payload to inspect.
            rm -rf "$STAGE_DIR"

            IMAGE_NAMESPACE="${VX_IMAGE_NAMESPACE:-vxture}"
            IMAGE_TAG="${VX_IMAGE_TAG:-latest}"
            # ── 镜像主源选择（owner 2026-08-22 接线）──────────────────────
            # 此前主源是**写死的偏好**：ACR 可用就用 ACR、否则 ghcr.io，没有任何
            # 开关能改变它。现在由 vars.IMAGE_PRIMARY_REGISTRY 给定主源，另一个
            # 源自动降为兜底——两源的韧性不变，变的只是谁先试。
            #
            # 取值 aliyun-acr | ghcr。未设时默认 aliyun-acr，与接线前行为一致，
            # 所以这次接线对现网是零行为变更。
            #
            # **非法值直接失败退出，不静默回退**：回退会让「我明明设了 ghcr」
            # 变成一次安静的忽略，而镜像源用错的后果是拉到旧镜像——那种错很难
            # 从现象倒推。
            PRIMARY="${VX_IMAGE_PRIMARY_REGISTRY:-aliyun-acr}"
            case "$PRIMARY" in
              aliyun-acr|ghcr) ;;
              *)
                echo "ERROR: IMAGE_PRIMARY_REGISTRY='$PRIMARY' 非法，只接受 aliyun-acr | ghcr" >&2
                exit 1
                ;;
            esac

            GHCR_REGISTRY="ghcr.io"
            IMAGE_REGISTRY=""

            # 候选顺序 = 主源在前，另一源兜底。ACR 自身还分内网/公网两个端点：
            # 内网快且省流，但 worker-01 不在同 VPC/区域时连不通（context
            # deadline exceeded），故内网在前、公网紧随。
            if [ "$PRIMARY" = "aliyun-acr" ]; then
              CANDIDATES="$VX_IMAGE_REGISTRY_INTERNAL $VX_IMAGE_REGISTRY_PUBLIC $GHCR_REGISTRY"
            else
              CANDIDATES="$GHCR_REGISTRY $VX_IMAGE_REGISTRY_INTERNAL $VX_IMAGE_REGISTRY_PUBLIC"
            fi

            for CAND in $CANDIDATES; do
              [ -n "$CAND" ] || continue
              if [ "$CAND" = "$GHCR_REGISTRY" ]; then
                # GHCR 上的镜像是公开可拉的，compose 直接拉即可，无需 login。
                IMAGE_REGISTRY="$CAND"
                echo "Using GHCR images: $IMAGE_REGISTRY/$IMAGE_NAMESPACE:$IMAGE_TAG"
                break
              fi
              [ "${VX_ACR_ENABLED:-false}" = "true" ] || continue
              if echo "$ALIYUN_ACR_PASSWORD" | docker login "$CAND" -u "$ALIYUN_ACR_USERNAME" --password-stdin; then
                IMAGE_REGISTRY="$CAND"
                echo "Using Aliyun ACR images: $IMAGE_REGISTRY/$IMAGE_NAMESPACE:$IMAGE_TAG"
                break
              fi
              echo "  ACR login failed/unreachable: $CAND — trying next endpoint"
            done

            [ -n "$IMAGE_REGISTRY" ] || {
              echo "ERROR: 主源 $PRIMARY 与兜底源均不可用，无法确定镜像 registry" >&2
              exit 1
            }

            # ── container-name migration (product_320: vx-* → vx-platform-*) ──
            # The stack's container_names were prefixed vx-platform-* (ACR
            # namespace hygiene). worker-01's hand-maintained runtime .env still
            # points inter-service URLs at the OLD names (e.g.
            # AUTH_BFF_URL=http://vx-auth-bff:3090), so migrate them in place
            # BEFORE the recreate or cross-service calls break. Idempotent
            # (results carry no old substring) + longest-first (so vx-admin
            # never mangles vx-admin-bff). Shipped nginx confs already carry the
            # new names; this only fixes host-side runtime env.
            #
            # ── container-name migration (vx-* → vx-platform-*) ─────────────
            # The runtime .env is hand-maintained and never regenerated (unlike
            # nginx confs and compose.platform.yml, both shipped fresh every
            # deploy), so an in-place rewrite is the only way these reach it.
            RT="${DEPLOY_RUNTIME_DIR:-/srv/vxture/runtime}"
            for envf in "$RT"/.env.*; do
              [ -f "$envf" ] || continue
              sed -i                 -e 's/vx-website-bff/vx-platform-website-bff/g'                 -e 's/vx-console-bff/vx-platform-console-bff/g'                 -e 's/vx-admin-bff/vx-platform-admin-bff/g'                 -e 's/vx-auth-bff/vx-platform-auth-bff/g'                 -e 's/vx-gateway-bff/vx-platform-gateway-bff/g'                 -e 's/vx-model-platform/vx-platform-model-platform/g'                 -e 's/vx-accounts/vx-platform-accounts/g'                 -e 's/vx-website/vx-platform-website/g'                 -e 's/vx-console/vx-platform-console/g'                 -e 's/vx-admin/vx-platform-admin/g'                 "$envf"
            done
            echo "  [ok] runtime .env inter-service names migrated to vx-platform-*"

            # ── L0 port re-map (2026-08-10) ─────────────────────────────────
            # Moved out of this inline sed block into a script, because the
            # inline version had become actively wrong: its 2026-07-24 rules
            # rewrote ADMIN_BFF_PORT=3031 → 3043, which is the exact reverse of
            # the current plan, so leaving it here would have reverted admin-bff
            # on every deploy while compose and nginx moved the other way.
            # 15- carries both generations (3090 and 3061 both land on 3081) and
            # is old-value-matched, so it is a no-op on an already-migrated host.
            #
            # 路径写绝对，不写 `scripts/15-...`：此处的 `cd "$DEPLOY_DIR"` 在下一行才
            # 执行，相对路径会在 SSH 登录默认目录（$HOME）里找，必然 `No such file or
            # directory` 然后 exit 127。上面那句 `[ok] …migrated to vx-platform-*`
            # 来自内联 sed 块而不是脚本文件，所以现象会像「14 能跑、15 找不到」，
            # 而两者根本不在同一种调用方式上。
            APPLY=1 DEPLOY_RUNTIME_DIR="$RT" bash "$DEPLOY_DIR/scripts/15-migrate-runtime-ports.sh"

            # 拉取新镜像并执行常规升级发布链路；migration/seed 只允许首次部署或人工脚本执行。
            cd "$DEPLOY_DIR"
            VX_IMAGE_REGISTRY="$IMAGE_REGISTRY" VX_IMAGE_NAMESPACE="$IMAGE_NAMESPACE" VX_IMAGE_TAG="$IMAGE_TAG" COMPOSE_PARALLEL_LIMIT=1 \
              bash scripts/31-regular-upgrade-platform.sh

# SonarQube Cloud Configuration
sonar.projectKey=vxture-platform_vxture-platform
sonar.organization=vxture-platform
sonar.host.url=https://sonarcloud.io

# Project information
sonar.projectName=vxture-platform
sonar.projectVersion=0.1.0

# Source configuration
sonar.sources=packages,portals,services,business
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/build/**,\
  **/dist/**,\
  **/.venv/**,\
  **/__pycache__/**,\
  **/.pytest_cache/**,\
  packages/core/config/src/schemas/platform.schema.ts,\
  packages/core/database/prisma/schema.prisma,\
  portals/**,\
  portals/admin/src/app/(admin)/model-platform/**,\
  portals/admin/src/modules/ai/ModelPlatformPage.tsx,\
  portals/admin/src/styles/admin-management-models-platform.css,\
  portals/console/src/app/[locale]/(console)/model-platform/**,\
  services/support/workers/**,\
  **/prisma/migrations/**,\
  **/prisma/seeds/**,\
  **/*seed*.sql

# Coverage: exclude portals, packages, and services that do not yet meet the new-code coverage gate.
sonar.coverage.exclusions=\
  portals/**,\
  services/commerce/**,\
  services/identity/**,\
  services/notification/**,\
  services/platform/**,\
  services/support/**,\
  services/tenant/**,\
  packages/**

# Duplication: website and console login containers are intentionally aligned.
# Shared UI and browser helpers stay in DS/platform packages and remain analyzed.
sonar.cpd.exclusions=\
  portals/website/src/components/auth/LoginForm.tsx,\
  portals/console/src/components/auth/LoginForm.tsx

# 这里曾有 `sonar.python.coverage.reportPaths=coverage.xml`（2026-08-28 删）。
# 两头都没了：产出侧的覆盖率步骤在 2026-07-28 随 model-platform 迁去 vxture-atlas
# 时一并移除（见 ci.yml 的 sonar job 头注），全仓再没有人产出 `coverage.xml`；
# 消费侧 sonar.sources 的四个目录里如今一个 .py 都没有。指向不存在文件的报告路径
# 不报错、只是静默不生效，留着会让人以为覆盖率是接着的。
#
# 将来要接回覆盖率：必须走 CI 扫描这条路径（Automatic Analysis 读不了覆盖率报告），
# 在 ci.yml 的 sonar job 前产出报告，再在这里声明对应语言的 reportPaths。

# Encoding
sonar.sourceEncoding=UTF-8

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" fill="none" role="img" aria-labelledby="t">
  <title id="t">产品矩阵 — 平台级分层底座</title>
  <!-- 产品矩阵 hero 插画（程序化 SVG，透明底；页面侧再叠一层向左渐隐的遮罩）。
       构图：右侧一组等轴测叠层——底座（模型/数据）、中层（能力编排）、顶层（应用面），
       层间竖直连接柱表示数据与能力上下贯通；旁边一只数据库圆柱与一块 API 面板。
       语义 = 平台级产品是分层、可组合的底座，与智能体广场的"网络/协同"形成区分。 -->
  <defs>
    <linearGradient id="slabTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfdbfe"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="slabLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="slabRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="slabTopIndigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c7d2fe"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="slabLeftIndigo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="slabRightIndigo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93c5fd" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#93c5fd" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <!-- 等轴测方板：顶面 / 左面 / 右面，原点在顶面中心 -->
    <symbol id="slab" viewBox="-160 -80 320 200">
      <path d="M0-80 160 0 0 80-160 0z" fill="url(#slabTop)"/>
      <path d="M-160 0 0 80v40l-160-80z" fill="url(#slabLeft)"/>
      <path d="M160 0 0 80v40l160-80z" fill="url(#slabRight)"/>
      <path d="M0-80 160 0 0 80-160 0z" fill="none" stroke="#ffffff" stroke-opacity="0.35"/>
    </symbol>
    <symbol id="slabIndigo" viewBox="-160 -80 320 200">
      <path d="M0-80 160 0 0 80-160 0z" fill="url(#slabTopIndigo)"/>
      <path d="M-160 0 0 80v40l-160-80z" fill="url(#slabLeftIndigo)"/>
      <path d="M160 0 0 80v40l160-80z" fill="url(#slabRightIndigo)"/>
      <path d="M0-80 160 0 0 80-160 0z" fill="none" stroke="#ffffff" stroke-opacity="0.35"/>
    </symbol>
  </defs>

  <!-- 背景光晕 -->
  <circle cx="860" cy="400" r="330" fill="url(#halo)" filter="url(#soft)"/>

  <!-- 三层叠板（自下而上：底座 / 编排 / 应用），错位堆叠留出层间空气 -->
  <use href="#slab" x="660" y="420" width="400" height="250"/>
  <!-- 底座上的网格纹理 -->
  <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="1">
    <path d="M760 470 860 520M800 450 900 500M840 430 940 480M880 410 980 460"/>
    <path d="M860 420 760 470M900 440 800 490M940 460 840 510M980 480 880 530"/>
  </g>

  <use href="#slabIndigo" x="660" y="300" width="400" height="250"/>
  <!-- 中层：几块"能力模块"小板 -->
  <g>
    <path d="M800 370 840 350 880 370 840 390z" fill="#ffffff" fill-opacity="0.85"/>
    <path d="M860 400 900 380 940 400 900 420z" fill="#ffffff" fill-opacity="0.7"/>
    <path d="M760 400 800 380 840 400 800 420z" fill="#ffffff" fill-opacity="0.55"/>
  </g>

  <use href="#slab" x="660" y="180" width="400" height="250"/>
  <!-- 顶层：应用窗口 -->
  <g>
    <path d="M790 250 900 195 990 240 880 295z" fill="#ffffff" fill-opacity="0.92"/>
    <path d="M800 252 900 202 980 242 880 292z" fill="#dbeafe"/>
    <path d="M812 258 852 238" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <path d="M830 272 900 237" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7"/>
    <path d="M848 286 908 256" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" stroke-opacity="0.45"/>
  </g>

  <!-- 层间贯通光柱（数据/能力向上流动） -->
  <g fill="url(#beam)">
    <rect x="852" y="100" width="16" height="130" rx="8"/>
    <rect x="852" y="235" width="16" height="110" rx="8" opacity="0.8"/>
    <rect x="852" y="360" width="16" height="110" rx="8" opacity="0.6"/>
  </g>

  <!-- 数据库圆柱（左下） -->
  <g transform="translate(560 480)">
    <ellipse cx="0" cy="0" rx="58" ry="22" fill="#60a5fa"/>
    <path d="M-58 0v70c0 12 26 22 58 22s58-10 58-22V0" fill="#2563eb"/>
    <ellipse cx="0" cy="0" rx="58" ry="22" fill="#bfdbfe"/>
    <path d="M-58 24c0 12 26 22 58 22s58-10 58-22" stroke="#93c5fd" stroke-width="2" fill="none"/>
    <path d="M-58 48c0 12 26 22 58 22s58-10 58-22" stroke="#93c5fd" stroke-width="2" fill="none"/>
  </g>
  <!-- 数据库 → 底座 连线 -->
  <path d="M618 500 700 470" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- API 面板（右上） -->
  <g transform="translate(1010 120)">
    <rect x="0" y="0" width="150" height="96" rx="12" fill="#ffffff" fill-opacity="0.92"/>
    <rect x="14" y="16" width="52" height="8" rx="4" fill="#2563eb"/>
    <rect x="14" y="34" width="110" height="6" rx="3" fill="#93c5fd"/>
    <rect x="14" y="48" width="86" height="6" rx="3" fill="#93c5fd" opacity="0.8"/>
    <rect x="14" y="62" width="120" height="6" rx="3" fill="#93c5fd" opacity="0.6"/>
    <circle cx="132" cy="20" r="6" fill="#22c55e"/>
  </g>
  <!-- API 面板 → 顶层 连线 -->
  <path d="M1010 190 960 225" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- 粒子 -->
  <g fill="#93c5fd">
    <circle cx="640" cy="200" r="3" fill-opacity="0.8"/>
    <circle cx="1120" cy="330" r="2.5" fill-opacity="0.7"/>
    <circle cx="1000" cy="600" r="3" fill-opacity="0.6"/>
    <circle cx="720" cy="120" r="2" fill-opacity="0.7"/>
    <circle cx="1160" cy="520" r="2" fill-opacity="0.5"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" fill="none" role="img" aria-labelledby="t">
  <title id="t">智能体广场 — 围绕核心协作的数字员工</title>
  <!-- 智能体广场 hero 插画（程序化 SVG，透明底；页面侧再叠一层向左渐隐的遮罩）。
       与 catalog-hero-platforms.svg 同一等轴测语言：等轴测地面 + 中心六棱柱"核心"，
       周围立着一圈智能体名片（抽象头像 + 名字条 + 状态点），曲线把它们连到核心，
       空中浮着几枚"任务已完成"小卡。语义 = 一群数字员工围绕平台核心协作。 -->
  <defs>
    <linearGradient id="hexTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfdbfe"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="hexLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="hexRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#eef4ff" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="cardEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="link" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#3b82f6" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1e3a8a" flood-opacity="0.18"/>
    </filter>
    <!-- 智能体名片：竖立的圆角卡，等轴测右倾（skewY -14°），左上抽象头像，两条名字/职责线，右上状态点 -->
    <symbol id="agentCard" viewBox="0 0 120 150">
      <g transform="skewY(-14)">
        <rect x="6" y="10" width="108" height="130" rx="14" fill="url(#card)" stroke="url(#cardEdge)" stroke-width="1.5"/>
        <rect x="6" y="10" width="108" height="8" rx="4" fill="url(#cardEdge)"/>
        <circle cx="38" cy="52" r="15" fill="url(#avatar)"/>
        <circle cx="38" cy="47" r="6" fill="#ffffff" fill-opacity="0.95"/>
        <path d="M27 63c2-7 8-10 11-10s9 3 11 10" fill="#ffffff" fill-opacity="0.95"/>
        <circle cx="98" cy="30" r="5" fill="#22c55e"/>
        <rect x="22" y="80" width="72" height="8" rx="4" fill="#1e3a8a" fill-opacity="0.75"/>
        <rect x="22" y="96" width="52" height="6" rx="3" fill="#3b82f6" fill-opacity="0.45"/>
        <rect x="22" y="112" width="64" height="6" rx="3" fill="#3b82f6" fill-opacity="0.3"/>
      </g>
    </symbol>
    <!-- 任务小卡：勾选 + 一条线 -->
    <symbol id="task" viewBox="0 0 96 34">
      <rect x="1" y="1" width="94" height="32" rx="10" fill="#ffffff" fill-opacity="0.95" stroke="#bfdbfe"/>
      <circle cx="18" cy="17" r="8" fill="#22c55e"/>
      <path d="M13.5 17.5l3 3 6-6" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="34" y="13" width="46" height="8" rx="4" fill="#93c5fd"/>
    </symbol>
  </defs>

  <!-- 光晕 + 等轴测地面 -->
  <circle cx="850" cy="420" r="320" fill="url(#halo)" filter="url(#soft)"/>
  <g stroke="#3b82f6" stroke-opacity="0.16" stroke-width="1" fill="none">
    <path d="M850 200 1210 380 850 560 490 380z"/>
    <path d="M850 260 1090 380 850 500 610 380z"/>
    <path d="M850 320 970 380 850 440 730 380z"/>
  </g>
  <g stroke="#6366f1" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="3 9">
    <path d="M560 344 1150 344M520 380 1180 380M560 416 1150 416"/>
  </g>

  <!-- 中心六棱柱核心 -->
  <g filter="url(#shadow)">
    <path d="M850 300l62 36v72l-62 36-62-36v-72z" fill="url(#hexLeft)"/>
    <path d="M850 372v72l62-36v-72z" fill="url(#hexRight)"/>
    <path d="M850 300l62 36-62 36-62-36z" fill="url(#hexTop)"/>
    <path d="M850 300l62 36-62 36-62-36z" fill="none" stroke="#ffffff" stroke-opacity="0.5"/>
  </g>
  <path d="M850 318l7 14 14 4-14 4-7 14-7-14-14-4 14-4z" fill="#ffffff" fill-opacity="0.95"/>
  <!-- 核心向上的能量束 -->
  <rect x="842" y="150" width="16" height="150" rx="8" fill="#93c5fd" fill-opacity="0.55"/>
  <rect x="846" y="110" width="8" height="60" rx="4" fill="#93c5fd" fill-opacity="0.35"/>

  <!-- 核心 ↔ 智能体 连线（贴地曲线，带流动虚线） -->
  <g stroke="url(#link)" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M812 370C740 350 700 330 660 300"/>
    <path d="M888 370C960 350 1000 330 1050 300"/>
    <path d="M812 400C740 430 690 460 640 500"/>
    <path d="M888 400C960 430 1010 460 1060 490"/>
    <path d="M850 440C850 480 850 520 850 560"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.8" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="2 14">
    <path d="M812 370C740 350 700 330 660 300"/>
    <path d="M888 370C960 350 1000 330 1050 300"/>
    <path d="M812 400C740 430 690 460 640 500"/>
    <path d="M888 400C960 430 1010 460 1060 490"/>
  </g>

  <!-- 智能体名片（远小近大，阴影落地） -->
  <g filter="url(#shadow)">
    <use href="#agentCard" x="590" y="190" width="96" height="120"/>
    <use href="#agentCard" x="1000" y="180" width="100" height="125"/>
    <use href="#agentCard" x="560" y="420" width="116" height="145"/>
    <use href="#agentCard" x="1010" y="400" width="118" height="148"/>
    <use href="#agentCard" x="790" y="480" width="120" height="150"/>
    <use href="#agentCard" x="700" y="120" width="76" height="95" opacity="0.8"/>
    <use href="#agentCard" x="1110" y="300" width="70" height="88" opacity="0.7"/>
  </g>

  <!-- 浮起的"任务已完成"小卡 -->
  <g filter="url(#shadow)">
    <use href="#task" x="700" y="330" width="96" height="34"/>
    <use href="#task" x="930" y="260" width="88" height="31"/>
    <use href="#task" x="920" y="560" width="92" height="32"/>
  </g>

  <!-- 粒子 -->
  <g fill="#93c5fd">
    <circle cx="640" cy="120" r="3" fill-opacity="0.8"/>
    <circle cx="1160" cy="200" r="2.5" fill-opacity="0.7"/>
    <circle cx="520" cy="300" r="2" fill-opacity="0.6"/>
    <circle cx="1180" cy="560" r="3" fill-opacity="0.6"/>
    <circle cx="720" cy="640" r="2" fill-opacity="0.5"/>
  </g>
</svg>
